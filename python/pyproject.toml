[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl-compiler"
version = "0.1.0"
description = "A deterministic DSL-to-C++17 schema compiler"
authors = [
    { name = "Andrew Marlow" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
# clang-format is pinned so every machine (dev and RHEL8) formats C++ identically,
# independent of the OS-provided clang-format version. Used by the pre-commit hook
# in .githooks/ (enable with scripts/install-git-hooks.sh).
#
# pylint is pinned for exactly the same reason, and was not: the build gate wants
# 10.00/10, but each pylint release adds checks, so an unpinned linter means the
# gate is defined by whichever version pip last resolved on that machine. The dev
# box and RHEL8 then disagree about whether the same unchanged code passes.
# Upgrading pylint is now a deliberate change with its own commit, rather than
# something that happens by surprise on someone else's machine.
#
# pybind11 was an UNDECLARED dependency until 2026-07-30: three test modules
# (test_bytes_type, test_roundtrip_nested_lists, test_generator_pybind11_coverage)
# compile and load a generated extension and cannot run without it, yet nothing
# said so. That is why it was simply absent on the RHEL8 host, and why two machines
# ended up four major versions apart. Verified against both 2.11.1 and 3.0.4.
dev = ["pylint==4.0.5", "pytest", "coverage", "clang-format==18.1.3", "pybind11==3.0.4"]

# No dependencies — the whole toolchain is pure Python
dependencies = []

[project.urls]
homepage = "https://github.com/marlowa/pubsub-project"
repository = "https://github.com/marlowa/pubsub-project"

[project.scripts]
generate-cpp-from-dsl = "tools.generate_cpp_from_dsl:main"
