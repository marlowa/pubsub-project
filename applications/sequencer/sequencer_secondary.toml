[network]
listen_host    = "${sequencer_secondary_network_listen_host}"
listen_port    = ${sequencer_secondary_network_listen_port}
er_listen_host = "${sequencer_secondary_network_er_listen_host}"
er_listen_port = ${sequencer_secondary_network_er_listen_port}

# Every gateway process the sequencer delivers execution reports to, one table each.
#
# protocol is the gateway_ids value: 1 = the FIX order gateway, 2 = the binary one. It
# says which wire format the report is encoded in. instance says which process of that
# protocol to send it to, numbered from 1 within the protocol -- so instance 1 of the FIX
# order gateway and instance 1 of the binary order gateway are different processes and do
# not collide.
#
# The instance numbers correspond to the _a/_b suffixes on the deployed components:
# instance 1 is _a and instance 2 is _b. The suffix names the process a member chooses to
# connect to; the number is what rides on the envelope.
#
# enabled = false leaves an entry configured but undialled, which is how preprod, prod and
# test-1 run a single instance of each protocol. Omitting the table entirely does the same
# thing; the flag exists so an environment can switch a gateway off without editing this
# template. See docs/availability/gateway_ha.md.

[[gateway]]
protocol = 1
instance = 1
enabled  = ${sequencer_secondary_fix_order_gateway_a_enabled}
host     = "${sequencer_secondary_fix_order_gateway_a_host}"
port     = ${sequencer_secondary_fix_order_gateway_a_port}

[[gateway]]
protocol = 1
instance = 2
enabled  = ${sequencer_secondary_fix_order_gateway_b_enabled}
host     = "${sequencer_secondary_fix_order_gateway_b_host}"
port     = ${sequencer_secondary_fix_order_gateway_b_port}

[[gateway]]
protocol = 2
instance = 1
enabled  = ${sequencer_secondary_binary_order_gateway_a_enabled}
host     = "${sequencer_secondary_binary_order_gateway_a_host}"
port     = ${sequencer_secondary_binary_order_gateway_a_port}

[[gateway]]
protocol = 2
instance = 2
enabled  = ${sequencer_secondary_binary_order_gateway_b_enabled}
host     = "${sequencer_secondary_binary_order_gateway_b_host}"
port     = ${sequencer_secondary_binary_order_gateway_b_port}

[matching_engine]
host = "${sequencer_secondary_matching_engine_host}"
port = ${sequencer_secondary_matching_engine_port}

# Pre-warmed standby connection to ME-secondary (used on ME failover).
# Required when ha.ha_enabled = true.
[matching_engine_secondary]
host = "${sequencer_secondary_matching_engine_secondary_host}"
port = ${sequencer_secondary_matching_engine_secondary_port}

[absence]
# How long the venue may be without a matching engine that can trade before the orders open at
# the time are cancelled, each member told, and trading halted (R-0117). While this instance
# leads, it measures how long it has had no matching engine to route orders to, and when that
# is longer than this it writes a CancelBook command that halts trading if it cancels any
# order. See docs/availability/deterministic_matching_engine.md, section 4.2.
absence_limit_seconds = ${shared_absence_limit_seconds}

[catch_up]
# Whether a matching engine catching up is told to send every report again. False: it sends only
# the reports of commands after the last one the WAL holds every report of, because the WAL's
# reports reach their members through the sequencers. ha_test.py sets it true only for its check
# that runs both engines on a copy of a scenario's WAL and compares every report with a replay.
# See docs/availability/far_back_catch_up.md, section 2.
send_every_report = false

[recovery]
# The longest the venue recovers by itself while no matching engine can trade. When the time
# without one, added to how long the catch-up under way will still take, passes this, the leading
# sequencer halts trading, tells the gateways to refuse orders with the reason, and leaves a person
# to decide when trading resumes. See docs/availability/far_back_catch_up.md, section 5.
automatic_recovery_limit_seconds = ${shared_automatic_recovery_limit_seconds}

[ha]
ha_enabled                  = ${ha_enabled}
instance_id                 = 2
arbiter_primary_host        = "${sequencer_secondary_ha_arbiter_primary_host}"
arbiter_primary_port        = ${sequencer_secondary_ha_arbiter_primary_port}
arbiter_secondary_host      = "${sequencer_secondary_ha_arbiter_secondary_host}"
arbiter_secondary_port      = ${sequencer_secondary_ha_arbiter_secondary_port}

[peer]
listen_host                      = "${sequencer_secondary_peer_listen_host}"
listen_port                      = ${sequencer_secondary_peer_listen_port}
host                             = "${sequencer_secondary_peer_host}"
port                             = ${sequencer_secondary_peer_port}

# How long a lease lasts, how much shorter an instance takes a lease it holds to be, and how
# often a leader renews. Shared across the venue, because every voter must agree; see
# environments/*.toml. Read only when [ha] ha_enabled is true.
[lease]
period_milliseconds = ${shared_lease_period_milliseconds}
drift_allowance_milliseconds = ${shared_lease_drift_allowance_milliseconds}
renewal_interval_milliseconds = ${shared_lease_renewal_interval_milliseconds}

# How many command identifiers the record of the commands in the log reserves room for: the most
# orders and cancels in one trading day. 200 million is the figure a MiFID test uses, twice the 100
# million the venue is tested with. The table, 4 GiB at this size, is reserved and filled from the log
# in the background when the sequencer starts, and never grows. Read only when [ha] ha_enabled is true.
[commands]
identifiers_reserved = 200000000

# How many orders the leader holds at most while it waits for the follower's acknowledgement or a voter's
# confirmation. Orders that arrive with this storage full wait in the write-ahead log instead, and are sent
# to the matching engine from there once released. 16,384 is about half a second at the highest rate
# measured on this venue, well beyond the follower's acknowledgement timeout. Allocated once at start.
orders_held_at_most = 16384

[wal_subscriber]
listen_host = "${sequencer_secondary_wal_subscriber_listen_host}"
listen_port = ${sequencer_secondary_wal_subscriber_listen_port}

[wal]
directory                 = "${sequencer_secondary_wal_directory}"
segment_size              = 4194304
snapshot_interval_seconds = 30

# How many records, and how many bytes of records, the leader keeps in memory from when it writes each one
# until it has sent it to the matching engine publishers, so that it sends the copy instead of reading the
# record back from the write-ahead log. A record that arrives with either limit reached is read back from the
# log instead, as is every record when either is zero. Records are at most about 400 bytes; 16 MiB holds the
# 32,768 records, which is every order held while waiting for the follower with one execution report each.
# Allocated once at start. See docs/availability/publishers_sent_from_memory.md.
records_kept_for_publishers = 32768
bytes_kept_for_publishers   = 16777216

[logging]
applog_level = "info"
syslog_level = "critical"

# Prometheus scrape endpoint for this process. See docs/operations/metrics.md.
#
# enabled comes from a shared value so the whole venue switches together. The listener is
# per process -- roughly fifteen of them run on one host in dev and cannot share a port --
# so host and port are per component. A port of 0 asks the OS to choose, which is how tests
# avoid colliding; the bound port is logged at startup.
#
# application and component are the first two tokens of every metric key this process
# emits. component is the INSTANCE, not the role, because performance investigation is
# always about one process; aggregate across instances with a matcher when that is wanted.
# ${component_name} is resolved per component by deploy.py, the same value the CPU layout
# uses to find this process.
[metrics]
enabled     = ${shared_metrics_enabled}
application = "${shared_metrics_application}"
component   = "${component_name}"
listen_host = "${sequencer_secondary_metrics_listen_host}"
listen_port = ${sequencer_secondary_metrics_listen_port}

# How long committing one record to the log takes. Every order passes through this on
# the reactor thread, so a slow commit is a stalled sequencer. Shared placeholder so both
# instances use the same bounds: histograms with differing bounds cannot be compared.
wal_append_buckets = ${shared_metrics_wal_append_buckets}

# An order is timed at several points on its way through the venue: when it reaches the
# sequencer, when it reaches the matching engine, when its report comes back through each of
# them, and when it reaches the gateway again. At every one of those points the component
# records how long the order had been inside the venue when it got there, counting from the
# moment the gateway read it off the client connection. Subtracting one point's time from the
# next gives how long the order spent on that leg of the journey, which is the whole reason
# for measuring this way.
#
# The numbers below are the boundaries of that histogram's buckets, in nanoseconds.
#
# They come from one shared value because every component has to use the same boundaries.
# Subtracting a time measured against one set of boundaries from a time measured against a
# different set does not give a rough answer; it gives a meaningless one.
order_path_elapsed_buckets = ${shared_metrics_order_path_elapsed_buckets}

[reactor]
cpu_pinning_enabled    = true
cpu_pinning_reserve_cpu0   = ${shared_reactor_cpu_pinning_reserve_cpu0}
cpu_registry_shm_path  = "${shared_reactor_cpu_registry_shm_path}"
cpu_registry_lock_file = "${shared_reactor_cpu_registry_lock_file}"
cpu_layout_file = "${shared_reactor_cpu_layout_file}"
cpu_layout_component = "${component_name}"
connect_retry_warning_interval = "15m"

# How long this reactor keeps looking for work before it goes to sleep, written with its
# unit as every duration here is. "0s" means it sleeps as soon as it has nothing to do.
#
# Set per component rather than from a shared value, because a component that keeps looking
# holds a whole core whether or not orders arrive, and there are only seven to go round. A
# standby, or anything not on the order round trip, should not take one. See the note near the
# top of the environment file for what it buys and what it costs.
spin_before_block = "${sequencer_secondary_reactor_spin_before_block}"
[event_queue_pool]
# Single pre-allocated pool sized for observed peak (50 clients, burst=10).
# 20 slabs × 4096 = 81,920 objects; never exhausted.
objects_per_slab = ${sequencer_secondary_event_queue_pool_objects_per_slab}
initial_slabs    = ${sequencer_secondary_event_queue_pool_initial_slabs}

[command_queue_pool]
# Single pre-allocated pool sized for observed peak (50 clients, burst=10).
# 130 slabs × 4096 = 532,480 objects; never exhausted.
objects_per_slab = ${sequencer_secondary_command_queue_pool_objects_per_slab}
initial_slabs    = ${sequencer_secondary_command_queue_pool_initial_slabs}
