[network]
listen_host    = "${binary_order_gateway_b_network_listen_host}"
listen_port    = ${binary_order_gateway_b_network_listen_port}
er_listen_host = "${binary_order_gateway_b_network_er_listen_host}"
er_listen_port = ${binary_order_gateway_b_network_er_listen_port}

[gateway]
# Which instance of this gateway protocol this process is, numbered from 1. Stamped onto
# every order envelope beside the protocol id, so the sequencer can route the execution
# report back to the process the order arrived on rather than merely to the right protocol.
#
# Must match a [[gateway]] entry in the sequencer's configuration. The sequencer logs an
# error naming the pair if it has reports for an instance it was never told about.
instance_id = ${binary_order_gateway_b_gateway_instance_id}

[sequencer]
ha_enabled     = ${ha_enabled}
primary_host   = "${binary_order_gateway_b_sequencer_primary_host}"
primary_port   = ${binary_order_gateway_b_sequencer_primary_port}
secondary_host = "${binary_order_gateway_b_sequencer_secondary_host}"
secondary_port = ${binary_order_gateway_b_sequencer_secondary_port}

# Clients authenticate by SCRAM-SHA-256 against the same service the FIX gateway uses.
[authentication_service]
host           = "${binary_order_gateway_b_authentication_service_host}"
port           = ${binary_order_gateway_b_authentication_service_port}
secondary_host = "${binary_order_gateway_b_authentication_service_secondary_host}"
secondary_port = ${binary_order_gateway_b_authentication_service_secondary_port}

[binary_session]
# Checked against each client's TargetCompID; a client naming a different venue is refused.
sender_comp_id = "BINARY-GATEWAY"

[timeouts]
scram_auth_timeout = "10s"

# Cancel-on-disconnect. Same contract as the FIX order gateway's: see the longer note in
# fix_order_gateway_a.toml. grace_period is what stops a gateway failure from flattening
# every book on the instance -- set it longer than a client takes to reconnect to its
# backup. GoodTillCancel and GoodTillDate orders are never cancelled on disconnect.
#
# The binary protocol has no clean-logout message, so unlike FIX every disconnect here
# takes the full grace period.
[cancel_on_disconnect]
enabled      = ${binary_order_gateway_b_cancel_on_disconnect_enabled}
grace_period = "${binary_order_gateway_b_cancel_on_disconnect_grace_period}"

[logging]
applog_level     = "info"
syslog_level     = "critical"
mode             = "none"
max_file_size    = 10240000
max_backup_files = 10

# Prometheus scrape endpoint for this process. See docs/operations/metrics.md.
#
# enabled comes from a shared value so the whole venue switches together. The listener is
# per process -- roughly fifteen of them run on one host in dev and cannot share a port --
# so host and port are per component. A port of 0 asks the OS to choose, which is how tests
# avoid colliding; the bound port is logged at startup.
#
# application and component are the first two tokens of every metric key this process
# emits. component is the INSTANCE, not the role, because performance investigation is
# always about one process; aggregate across instances with a matcher when that is wanted.
# ${component_name} is resolved per component by deploy.py, the same value the CPU layout
# uses to find this process.
[metrics]
enabled     = ${shared_metrics_enabled}
application = "${shared_metrics_application}"
component   = "${component_name}"
listen_host = "${binary_order_gateway_b_metrics_listen_host}"
listen_port = ${binary_order_gateway_b_metrics_listen_port}

# Bucket bounds in nanoseconds for order_round_trip_nanoseconds. From a shared
# placeholder, not written out here: the metric compares this gateway against the other
# protocol's, and histograms with differing bounds cannot be compared or aggregated.
order_round_trip_buckets = ${shared_metrics_order_round_trip_buckets}

# Bucket bounds in nanoseconds for order_ingress_to_forward_nanoseconds. From the same
# shared placeholder for the same reason: this is the metric that compares the two
# gateways, so bounds that differ between them make the comparison meaningless.
order_ingress_to_forward_buckets = ${shared_metrics_order_ingress_to_forward_buckets}

# An order is timed at several points on its way through the venue: when it reaches the
# sequencer, when it reaches the matching engine, when its report comes back through each of
# them, and when it reaches the gateway again. At every one of those points the component
# records how long the order had been inside the venue when it got there, counting from the
# moment the gateway read it off the client connection. Subtracting one point's time from the
# next gives how long the order spent on that leg of the journey, which is the whole reason
# for measuring this way.
#
# The numbers below are the boundaries of that histogram's buckets, in nanoseconds.
#
# They come from one shared value because every component has to use the same boundaries.
# Subtracting a time measured against one set of boundaries from a time measured against a
# different set does not give a rough answer; it gives a meaningless one.
order_path_elapsed_buckets = ${shared_metrics_order_path_elapsed_buckets}

[reactor]
cpu_pinning_enabled    = true
cpu_pinning_reserve_cpu0   = ${shared_reactor_cpu_pinning_reserve_cpu0}
cpu_registry_shm_path  = "${shared_reactor_cpu_registry_shm_path}"
cpu_registry_lock_file = "${shared_reactor_cpu_registry_lock_file}"
cpu_layout_file = "${shared_reactor_cpu_layout_file}"
cpu_layout_component = "${component_name}"
connect_retry_warning_interval = "15m"

# How long this reactor keeps looking for work before it goes to sleep, written with its
# unit as every duration here is. "0s" means it sleeps as soon as it has nothing to do.
#
# Set per component rather than from a shared value, because a component that keeps looking
# holds a whole core whether or not orders arrive, and there are only seven to go round. A
# standby, or anything not on the order round trip, should not take one. See the note near the
# top of the environment file for what it buys and what it costs.
spin_before_block = "${binary_order_gateway_b_reactor_spin_before_block}"
[event_queue_pool]
# Sized as the FIX order gateway's is: one event per inbound PDU, and the perf tests drive
# the same order volume through either gateway.
objects_per_slab = ${binary_order_gateway_b_event_queue_pool_objects_per_slab}
initial_slabs    = ${binary_order_gateway_b_event_queue_pool_initial_slabs}

[command_queue_pool]
objects_per_slab = ${binary_order_gateway_b_command_queue_pool_objects_per_slab}
initial_slabs    = ${binary_order_gateway_b_command_queue_pool_initial_slabs}

# Backs cancel-on-disconnect: one entry per order a session has resting on the book,
# held until a terminal ExecutionReport retires it or the session's cancels are drained.
# Size to the maximum expected concurrent open orders with headroom.
[open_order_pool]
objects_per_pool = ${binary_order_gateway_b_open_order_pool_objects_per_pool}
initial_pools    = ${binary_order_gateway_b_open_order_pool_initial_pools}
