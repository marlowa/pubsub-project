[network]
listen_host    = "${binary_order_gateway_a_network_listen_host}"
listen_port    = ${binary_order_gateway_a_network_listen_port}
er_listen_host = "${binary_order_gateway_a_network_er_listen_host}"
er_listen_port = ${binary_order_gateway_a_network_er_listen_port}

[gateway]
# Which instance of this gateway protocol this process is, numbered from 1. Stamped onto
# every order envelope beside the protocol id, so the sequencer can route the execution
# report back to the process the order arrived on rather than merely to the right protocol.
#
# Must match a [[gateway]] entry in the sequencer's configuration. The sequencer logs an
# error naming the pair if it has reports for an instance it was never told about.
instance_id = ${binary_order_gateway_a_gateway_instance_id}

[sequencer]
ha_enabled     = true
primary_host   = "${binary_order_gateway_a_sequencer_primary_host}"
primary_port   = ${binary_order_gateway_a_sequencer_primary_port}
secondary_host = "${binary_order_gateway_a_sequencer_secondary_host}"
secondary_port = ${binary_order_gateway_a_sequencer_secondary_port}

# Clients authenticate by SCRAM-SHA-256 against the same service the FIX gateway uses.
[authentication_service]
host           = "${binary_order_gateway_a_authentication_service_host}"
port           = ${binary_order_gateway_a_authentication_service_port}
secondary_host = "${binary_order_gateway_a_authentication_service_secondary_host}"
secondary_port = ${binary_order_gateway_a_authentication_service_secondary_port}

[binary_session]
# Checked against each client's TargetCompID; a client naming a different venue is refused.
sender_comp_id = "BINARY-GATEWAY"

[timeouts]
scram_auth_timeout = "10s"

# Cancel-on-disconnect. Same contract as the FIX order gateway's: see the longer note in
# fix_order_gateway_a.toml. grace_period is what stops a gateway failure from flattening
# every book on the instance -- set it longer than a client takes to reconnect to its
# backup. GoodTillCancel and GoodTillDate orders are never cancelled on disconnect.
#
# The binary protocol has no clean-logout message, so unlike FIX every disconnect here
# takes the full grace period.
[cancel_on_disconnect]
enabled      = ${binary_order_gateway_a_cancel_on_disconnect_enabled}
grace_period = "${binary_order_gateway_a_cancel_on_disconnect_grace_period}"

[logging]
applog_level     = "info"
syslog_level     = "critical"
mode             = "none"
max_file_size    = 10240000
max_backup_files = 10

# Prometheus scrape endpoint for this process. See docs/operations/metrics.md.
#
# enabled comes from a shared value so the whole venue switches together. The listener is
# per process -- roughly fifteen of them run on one host in dev and cannot share a port --
# so host and port are per component. A port of 0 asks the OS to choose, which is how tests
# avoid colliding; the bound port is logged at startup.
#
# application and component are the first two tokens of every metric key this process
# emits. component is the INSTANCE, not the role, because performance investigation is
# always about one process; aggregate across instances with a matcher when that is wanted.
# ${component_name} is resolved per component by deploy.py, the same value the CPU layout
# uses to find this process.
[metrics]
enabled     = ${shared_metrics_enabled}
application = "${shared_metrics_application}"
component   = "${component_name}"
listen_host = "${binary_order_gateway_a_metrics_listen_host}"
listen_port = ${binary_order_gateway_a_metrics_listen_port}

# Bucket bounds in nanoseconds for order_round_trip_nanoseconds. From a shared
# placeholder, not written out here: the metric compares this gateway against the other
# protocol's, and histograms with differing bounds cannot be compared or aggregated.
order_round_trip_buckets = ${shared_metrics_order_round_trip_buckets}

[reactor]
cpu_pinning_enabled    = true
cpu_pinning_reserve_cpu0   = ${shared_reactor_cpu_pinning_reserve_cpu0}
cpu_registry_shm_path  = "${shared_reactor_cpu_registry_shm_path}"
cpu_registry_lock_file = "${shared_reactor_cpu_registry_lock_file}"
cpu_layout_file = "${shared_reactor_cpu_layout_file}"
cpu_layout_component = "${component_name}"
connect_retry_warning_interval = "15m"

[event_queue_pool]
# Sized as the FIX order gateway's is: one event per inbound PDU, and the perf tests drive
# the same order volume through either gateway.
objects_per_slab = ${binary_order_gateway_a_event_queue_pool_objects_per_slab}
initial_slabs    = ${binary_order_gateway_a_event_queue_pool_initial_slabs}

[command_queue_pool]
objects_per_slab = ${binary_order_gateway_a_command_queue_pool_objects_per_slab}
initial_slabs    = ${binary_order_gateway_a_command_queue_pool_initial_slabs}

# Backs cancel-on-disconnect: one entry per order a session has resting on the book,
# held until a terminal ExecutionReport retires it or the session's cancels are drained.
# Size to the maximum expected concurrent open orders with headroom.
[open_order_pool]
objects_per_pool = ${binary_order_gateway_a_open_order_pool_objects_per_pool}
initial_pools    = ${binary_order_gateway_a_open_order_pool_initial_pools}
