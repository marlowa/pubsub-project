[network]
# Order listener. Pre-warmed so the sequencer's connection is already up when the
# secondary is promoted (Slice C+D). Idle while in FOLLOWER mode (orders discarded).
listen_host = "${matching_engine_secondary_network_listen_host}"
listen_port = ${matching_engine_secondary_network_listen_port}

[sequencer_er]
host = "${matching_engine_secondary_sequencer_er_host}"
port = ${matching_engine_secondary_sequencer_er_port}

[sequencer_er_secondary]
host = "${matching_engine_secondary_sequencer_er_secondary_host}"
port = ${matching_engine_secondary_sequencer_er_secondary_port}

[ha]
enabled = true
role    = "secondary"

[book_replication]
# Symmetric with the primary: this instance listens, and also dials its peer. See the
# primary's file for why both directions are held permanently.
listen_host = "${matching_engine_secondary_book_replication_listen_host}"
listen_port = ${matching_engine_secondary_book_replication_listen_port}
host = "${matching_engine_secondary_book_replication_host}"
port = ${matching_engine_secondary_book_replication_port}

[ha_instance]
instance_id = ${matching_engine_secondary_instance_id}
# Where the leadership epoch outlives the process. Without it a restart
# starts at generation zero and can reuse a generation the venue has spent.
epoch_state_file = "${matching_engine_secondary_epoch_state_file}"

[arbiter_primary]
host = "${matching_engine_secondary_arbiter_primary_host}"
port = ${matching_engine_secondary_arbiter_primary_port}

[arbiter_secondary]
host = "${matching_engine_secondary_arbiter_secondary_host}"
port = ${matching_engine_secondary_arbiter_secondary_port}

[ha_timing]
# How long an instance catching up on the sequencer's record waits, with nothing arriving,
# before asking again. A sequencer that is not leading drops the request without answering.
catch_up_retry_seconds = 15

# How long a lease lasts, how much shorter an instance takes a lease it holds to be, and how
# often a leader renews. Shared across the venue, because every voter must agree; see
# environments/*.toml.
[lease]
period_milliseconds = ${shared_lease_period_milliseconds}
drift_allowance_milliseconds = ${shared_lease_drift_allowance_milliseconds}
renewal_interval_milliseconds = ${shared_lease_renewal_interval_milliseconds}

[logging]
applog_level = "info"
syslog_level = "critical"

# Prometheus scrape endpoint for this process. See docs/operations/metrics.md.
#
# enabled comes from a shared value so the whole venue switches together. The listener is
# per process -- roughly fifteen of them run on one host in dev and cannot share a port --
# so host and port are per component. A port of 0 asks the OS to choose, which is how tests
# avoid colliding; the bound port is logged at startup.
#
# application and component are the first two tokens of every metric key this process
# emits. component is the INSTANCE, not the role, because performance investigation is
# always about one process; aggregate across instances with a matcher when that is wanted.
# ${component_name} is resolved per component by deploy.py, the same value the CPU layout
# uses to find this process.
[metrics]
enabled     = ${shared_metrics_enabled}
application = "${shared_metrics_application}"
component   = "${component_name}"
listen_host = "${matching_engine_secondary_metrics_listen_host}"
listen_port = ${matching_engine_secondary_metrics_listen_port}

# An order is timed at several points on its way through the venue: when it reaches the
# sequencer, when it reaches the matching engine, when its report comes back through each of
# them, and when it reaches the gateway again. At every one of those points the component
# records how long the order had been inside the venue when it got there, counting from the
# moment the gateway read it off the client connection. Subtracting one point's time from the
# next gives how long the order spent on that leg of the journey, which is the whole reason
# for measuring this way.
#
# The numbers below are the boundaries of that histogram's buckets, in nanoseconds.
#
# They come from one shared value because every component has to use the same boundaries.
# Subtracting a time measured against one set of boundaries from a time measured against a
# different set does not give a rough answer; it gives a meaningless one.
order_path_elapsed_buckets = ${shared_metrics_order_path_elapsed_buckets}

[reactor]
cpu_pinning_enabled    = true
cpu_pinning_reserve_cpu0   = ${shared_reactor_cpu_pinning_reserve_cpu0}
cpu_registry_shm_path  = "${shared_reactor_cpu_registry_shm_path}"
cpu_registry_lock_file = "${shared_reactor_cpu_registry_lock_file}"
cpu_layout_file = "${shared_reactor_cpu_layout_file}"
cpu_layout_component = "${component_name}"
connect_retry_warning_interval = "15m"

# How long this reactor keeps looking for work before it goes to sleep, written with its
# unit as every duration here is. "0s" means it sleeps as soon as it has nothing to do.
#
# Set per component rather than from a shared value, because a component that keeps looking
# holds a whole core whether or not orders arrive, and there are only seven to go round. A
# standby, or anything not on the order round trip, should not take one. See the note near the
# top of the environment file for what it buys and what it costs.
spin_before_block = "${matching_engine_secondary_reactor_spin_before_block}"
[event_queue_pool]
objects_per_slab = ${matching_engine_secondary_event_queue_pool_objects_per_slab}
initial_slabs    = ${matching_engine_secondary_event_queue_pool_initial_slabs}

[order_book]
initial_capacity = 262144

# Warn when the book's storage allocation reaches this size. The book is a growing hash
# map on the OS heap rather than a pool or slab, so handler_for_pool_exhausted never sees
# it: it once reached 9.9 GB and this process was OOM-killed having logged no memory
# warning at all. One line per doubling, never per order.
growth_report_threshold_bytes = 67108864

# Where the open orders live, so that an order placed before a restart is still open, and
# still cancellable, after one. A mapped region of fixed-size records, one per open order.
# It survives this process dying and not the machine dying, which is what the second
# machine is for. See docs/durability/open_order_checkpoint.md.
region_path = "${matching_engine_secondary_order_book_region_path}"

# The most orders that may be open at once. Fixes the size of the region, which cannot
# grow: an order arriving when every record is taken is refused, because the venue must not
# accept an order it could not account for after a restart. Size it to the peak orders open
# at once, not to the day's volume -- a cancelled or filled order releases its record.
region_capacity = ${matching_engine_secondary_order_book_region_capacity}

# How long the venue may be unable to match before the orders open at the time are
# cancelled and trading halts. Measured from when matching stopped to when it resumes --
# the whole absence, not the recovery step. Where nothing was open there is nothing stale,
# so it resumes without halting.
#
# A trading decision rather than a measurement: it says how long a member's resting order
# stays meaningful in this market. The hazard is not that an order is old, but that its
# owner was locked out of it while the market moved. See R-0117 and R-0118.
absence_limit_seconds = ${matching_engine_secondary_order_book_absence_limit_seconds}

# What a promoted matching engine does with the orders it inherits.
#
#   "cancel" -- cancel every order that was open when leadership moved and tell the member
#               that placed it, then lead an empty book. The member is left in no doubt and
#               must place again what it still wants.
#   "keep"   -- carry the book across, so an order open before the promotion is open after it
#               and still cancellable by its owner. This is what R-0073 asks for.
#
# "keep" is the better outcome for a member and is only safe where the book the promoted
# instance holds is known to be the book the venue had. Nothing establishes that yet: neither
# the replica maintained by BookUpdate nor the completeness of the catch-up that follows it
# (R-0101, and docs/bug_list.md BUG-0074). So the default is the worse outcome that is
# certainly true rather than the better one that is not yet established.
open_orders_on_promotion = "${matching_engine_secondary_order_book_open_orders_on_promotion}"

[command_queue_pool]
objects_per_slab = ${matching_engine_secondary_command_queue_pool_objects_per_slab}
initial_slabs    = ${matching_engine_secondary_command_queue_pool_initial_slabs}
