[network]
listen_host = "${matching_engine_publisher_primary_network_listen_host}"

[sequencer_wal]
host = "${matching_engine_publisher_primary_sequencer_wal_host}"
port = ${matching_engine_publisher_primary_sequencer_wal_port}

[sequencer_wal_secondary]
host = "${matching_engine_publisher_primary_sequencer_wal_secondary_host}"
port = ${matching_engine_publisher_primary_sequencer_wal_secondary_port}

[topics.orders]
listen_port = ${matching_engine_publisher_primary_topics_orders_listen_port}

[topics.execution_reports]
listen_port = ${matching_engine_publisher_primary_topics_execution_reports_listen_port}

[wal]
directory                 = "${matching_engine_publisher_primary_wal_directory}"
segment_size              = 4194304
snapshot_interval_seconds = 30

[ha]
ha_enabled                      = true
instance_id                     = 1
arbiter_primary_host            = "${matching_engine_publisher_primary_ha_arbiter_primary_host}"
arbiter_primary_port            = ${matching_engine_publisher_primary_ha_arbiter_primary_port}
arbiter_secondary_host          = "${matching_engine_publisher_primary_ha_arbiter_secondary_host}"
arbiter_secondary_port          = ${matching_engine_publisher_primary_ha_arbiter_secondary_port}
arbitration_timeout_seconds     = 3
peer_listen_host                = "${matching_engine_publisher_primary_ha_peer_listen_host}"
peer_listen_port                = ${matching_engine_publisher_primary_ha_peer_listen_port}
peer_host                       = "${matching_engine_publisher_primary_ha_peer_host}"
peer_port                       = ${matching_engine_publisher_primary_ha_peer_port}
heartbeat_interval_seconds      = 2
heartbeat_timeout_seconds       = 6
startup_election_timeout_seconds = 20

[subscriber_lag]
default_max_lag_records = 100000

[logging]
applog_level = "info"
syslog_level = "critical"

# Prometheus scrape endpoint for this process. See docs/design/metrics.md.
#
# enabled comes from a shared value so the whole venue switches together. The listener is
# per process -- roughly fifteen of them run on one host in dev and cannot share a port --
# so host and port are per component. A port of 0 asks the OS to choose, which is how tests
# avoid colliding; the bound port is logged at startup.
#
# application and component are the first two tokens of every metric key this process
# emits. component is the INSTANCE, not the role, because performance investigation is
# always about one process; aggregate across instances with a matcher when that is wanted.
# ${component_name} is resolved per component by deploy.py, the same value the CPU layout
# uses to find this process.
[metrics]
enabled     = ${shared_metrics_enabled}
application = "${shared_metrics_application}"
component   = "${component_name}"
listen_host = "${matching_engine_publisher_primary_metrics_listen_host}"
listen_port = ${matching_engine_publisher_primary_metrics_listen_port}

[reactor]
cpu_pinning_enabled            = true
cpu_pinning_reserve_cpu0       = ${shared_reactor_cpu_pinning_reserve_cpu0}
cpu_registry_shm_path          = "${shared_reactor_cpu_registry_shm_path}"
cpu_registry_lock_file         = "${shared_reactor_cpu_registry_lock_file}"
cpu_layout_file = "${shared_reactor_cpu_layout_file}"
cpu_layout_component = "${component_name}"
connect_retry_warning_interval = "15m"

[event_queue_pool]
objects_per_slab = 1024
initial_slabs    = 1

[command_queue_pool]
objects_per_slab = 1024
initial_slabs    = 1
