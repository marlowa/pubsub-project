[network]
listen_host         = "${order_gateway_a_network_listen_host}"
listen_port         = ${order_gateway_a_network_listen_port}
tls_listen_port     = ${order_gateway_a_network_tls_listen_port}
raw_buffer_capacity = 16777216 # for TCP buffering; 16 MiB per FIX session.
                              # At ~175 bytes/NOS, 16 MiB holds ~71,900 messages at the 75%
                              # high-water mark — above the 50,000 NOS per session sent by the
                              # standard 20-client × 50-burst perf test.  The previous 4 MiB
                              # value (~24,000 messages at 75%) triggered read backpressure on
                              # all sessions under that load, causing fix8 to reset connections
                              # when the burst was higher (5×200 = 200K NOS/session).
                              # Note: 5×200 still exceeds this buffer (200K > 71K); that
                              # configuration is beyond the supported per-session burst size.
er_listen_host      = "${order_gateway_a_network_er_listen_host}"
er_listen_port      = ${order_gateway_a_network_er_listen_port}

[authentication_service]
host           = "${order_gateway_a_authentication_service_host}"
port           = ${order_gateway_a_authentication_service_port}
secondary_host = "${order_gateway_a_authentication_service_secondary_host}"
secondary_port = ${order_gateway_a_authentication_service_secondary_port}

[sequencer]
ha_enabled      = true
primary_host    = "${order_gateway_a_sequencer_primary_host}"
primary_port    = ${order_gateway_a_sequencer_primary_port}
secondary_host  = "${order_gateway_a_sequencer_secondary_host}"
secondary_port  = ${order_gateway_a_sequencer_secondary_port}

[gateway]
# Which instance of this gateway protocol this process is, numbered from 1. Stamped onto
# every order envelope beside the protocol id, so the sequencer can route the execution
# report back to the process the order arrived on rather than merely to the right protocol.
#
# Must match a [[gateway]] entry in the sequencer's configuration. The sequencer logs an
# error naming the pair if it has reports for an instance it was never told about.
instance_id = ${order_gateway_a_gateway_instance_id}

[fix_session]
sender_comp_id         = "GATEWAY"
default_target_comp_id = "CLIENT"

[timeouts]
logon_timeout      = "30s"
scram_auth_timeout = "10s"

[logging]
applog_level     = "info"
syslog_level     = "critical"
mode             = "none"
max_file_size    = 10240000
max_backup_files = 10

[reactor]
cpu_pinning_enabled    = true
cpu_pinning_reserve_cpu0   = ${shared_reactor_cpu_pinning_reserve_cpu0}
cpu_registry_shm_path  = "${shared_reactor_cpu_registry_shm_path}"
cpu_registry_lock_file = "${shared_reactor_cpu_registry_lock_file}"
cpu_layout_file = "${shared_reactor_cpu_layout_file}"
cpu_layout_component = "${component_name}"
connect_retry_warning_interval = "15m"

[event_queue_pool]
# Single pre-allocated pool sized for observed peak (50 clients, burst=10).
# Previous peak 21,504; still exhausted at 22,528 once full pipeline active.
# Doubled to 45,056 for headroom.
# A heavy perf test of a million orders caused this to be increased again, to xxxxx
objects_per_slab = 80000
initial_slabs    = 1

[command_queue_pool]
# Single pre-allocated pool sized for observed peak (50 clients, burst=10).
# 62 slabs × 1024 base + 253 exhaustion chains × 1024 = 322,560; rounded to 327,680.
# A heavy perf test of a million orders caused this to be increased again, to 1,000,000
objects_per_slab = 1000000
initial_slabs    = 1

[fix_tls]
# Set enabled=true to require TLS on the inbound FIX listener.
# cert and key are paths relative to the process working directory.
enabled  = ${order_gateway_a_fix_tls_enabled}
cert     = "${order_gateway_a_fix_tls_cert}"
key      = "${order_gateway_a_fix_tls_key}"

[fix_capture]
# Set enabled=true to write all inbound and outbound FIX wire bytes to a binary file.
# The file is truncated on each gateway start.  Record format (little-endian):
#   uint32_t payload_size | int64_t timestamp_ns | uint8_t direction(0=in,1=out) | bytes
enabled     = false
file        = "${order_gateway_a_fix_capture_file}"
ring_bytes  = ${order_gateway_a_fix_capture_ring_bytes}

[fix_limits]
# Runtime field-length limits for inbound FIX strings (bytes, excluding NUL).
# Clients sending longer values receive a FIX BusinessReject (MsgType=j).
# Must be <= the compile-time hard ceilings: cl_ord_id=128, symbol=64, order_qty=32.
# These limits must be documented in the gateway FIX connectivity specification.
max_symbol_length    = ${order_gateway_a_fix_limits_max_symbol_length}
max_order_qty_length = ${order_gateway_a_fix_limits_max_order_qty_length}

[open_order_pool]
# Pre-allocated pool for open-order string storage (ExpandablePoolAllocator).
# objects_per_pool: how many OpenOrderEntry slots per pool slab.
# Size to the maximum expected concurrent open orders with headroom.
objects_per_pool = ${order_gateway_a_open_order_pool_objects_per_pool}
initial_pools    = ${order_gateway_a_open_order_pool_initial_pools}
