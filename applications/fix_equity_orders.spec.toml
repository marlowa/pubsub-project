# ---------------------------------------------------------------------------
# Selection spec for fix_equity_orders.dsl
#
# The curated set of FIX messages/fields that become internal PDUs. Field types
# and enum values are taken from the FIX data dictionary; this file chooses which
# fields matter, their order, required/optional, the PDU ids, and the internal
# (non-DD) fields. Regenerate the .dsl with:
#
#     python -m dd_to_dsl applications/fix_equity_orders.spec.toml
#
# At a venue with custom tags, add those tags to the data dictionary and list them
# here; nothing in the .dsl is hand-authored.
# ---------------------------------------------------------------------------

output = "applications/fix_equity_orders.dsl"
data_dictionary = [
    "libraries/fix_codec/data_dictionary/FIXT11.xml",
    "libraries/fix_codec/data_dictionary/FIX50SP2.xml",
]

# FIX fields emitted as DSL enums (base type char/i32 derived from the DD field type).
enums = ["OrdType", "Side", "TimeInForce", "OrdStatus", "ExecType", "ExecInst", "OrdRejReason", "CxlRejReason"]

# Where the DD type does not map to the desired internal representation.
[type_overrides]
TradeDate = "datetime_ns"   # DD type LOCALMKTDATE; carried internally as a timestamp

[[messages]]
name = "NewOrderSingle"
pdu_id = 1000
required = ["ClOrdID", "Side", "Symbol", "OrdType", "TransactTime", "OrderQty"]
optional = ["SecurityID", "SecurityIDSource", "Price", "StopPx", "TimeInForce", "Account", "ExDestination", "ExecInst", "MinQty", "MaxFloor", "ExpireTime", "Text"]
extra = [
    { name = "sender_comp_id", type = "string", comment = "SenderCompID retained for audit/logging in the sequencer WAL" },
    { name = "gateway_session_conn_id", type = "i32", comment = "internal conn_id of the originating FIX session; used for ER routing" },
    { name = "sequenced_at", type = "datetime_ns", comment = "wall time stamped by sequencer when this PDU is sequenced; used by ME for transact_time during replay" },
]

[[messages]]
name = "OrderCancelRequest"
pdu_id = 1001
required = ["OrigClOrdID", "ClOrdID", "Side", "Symbol", "TransactTime", "OrderQty"]
optional = ["Account", "Text"]
extra = [
    { name = "sender_comp_id", type = "string", comment = "SenderCompID retained for audit/logging in the sequencer WAL" },
    { name = "gateway_session_conn_id", type = "i32", comment = "internal conn_id of the originating FIX session; used for ER routing" },
    { name = "sequenced_at", type = "datetime_ns", comment = "wall time stamped by sequencer when this PDU is sequenced; used by ME for transact_time during replay" },
]

[[messages]]
name = "ExecutionReport"
pdu_id = 1002
required = ["OrderID", "ExecID", "ExecType", "OrdStatus", "Symbol", "Side", "LeavesQty", "CumQty", "AvgPx", "TransactTime"]
optional = ["SecurityID", "SecurityIDSource", "ClOrdID", "OrigClOrdID", "OrdType", "Price", "StopPx", "OrderQty", "TimeInForce", "Account", "ExDestination", "ExecInst", "LastQty", "LastPx", "TradeDate", "ExecRefID", "OrdRejReason", "CxlRejReason", "Text", "MinQty", "MaxFloor", "ExpireTime"]
extra = [
    { name = "gateway_session_conn_id", type = "i32", comment = "echoed from NOS; gateway routes ER to the exact originating FIX session" },
]
