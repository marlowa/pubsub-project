\* Model checking configuration for MajorityLeaseHA.tla with the leading sequencer's statement that a
\* matching engine has stopped working and may not lead
\* (docs/availability/a_matching_engine_that_stops_working.md; findings.md section 5).
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config EngineStallHA.cfg MajorityLeaseHA.tla
\*
\* Every rule of the design is on, as in MajorityLeaseHA.cfg, and voters 2 and 3 may come to hold or to drop
\* the statement that instance 1 may not lead at any moment. findings.md section 5 gives the failure budgets
\* checked and the settings that are made to fail.
CONSTANTS
    Lease = 2
    MaxEpoch = 0
    MaxCrashes = 1
    MaxThirdRestarts = 1
    MaxLinkFailures = 0
    ThirdUpAtStart = TRUE
    ThirdStaysDown = FALSE
    Prompt = FALSE
    HolderCountsFromSend = TRUE
    WaitOutOwnGrant = TRUE
    RestartWaits = TRUE
    InstancesKeepPromises = TRUE
    PeerVotes = TRUE
    CandidateYields = TRUE
    CandidateResends = FALSE
    DegradedPromotion = FALSE
    RecordBeforeAsking = TRUE
    SequencerDenies = TRUE
    DenialRefusesRenewals = TRUE
    DenialOverridesYield = TRUE
SPECIFICATION Spec
CONSTRAINT EpochBound
INVARIANTS
    TypeOK
    AtMostOneActing
    EpochNamesOneLeader
    DeniedLeaderStops
