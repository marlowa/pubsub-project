\* Model checking configuration for FollowerBehindHA.tla, rule 11 of the leadership design.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config FollowerBehindHA.cfg FollowerBehindHA.tla
\*
\* Every part of rule 11 is on. InstancesRecordFirst is TRUE here: an instance writes a statement to
\* disk before it grants. The design as decided records it in memory first and writes it to disk in the
\* background, and with InstancesRecordFirst = FALSE the property does not hold; findings.md section 12
\* gives that counterexample, which is the risk accepted. The arbiter tier is two arbiters, with one
\* change of active arbiter and one failure of the link between them allowed. A leader acts on a
\* command its peer lacks only once its peer, or both arbiters, have confirmed its statement, or the
\* active arbiter has confirmed it alone after the link has been down long enough; an arbiter that may
\* lack a statement confirmed alone grants nothing (findings.md section 12.6). A run at these budgets
\* does not finish. Section 12.6 gives the smaller budgets of the run that does: one command, two
\* statements, two leaderships, one crash and no restart of the arbiter tier, which visits 301,843,316
\* distinct states in about 23 minutes on 32 workers.
CONSTANTS
    MaxCommands = 2
    MaxStatements = 3
    MaxElections = 3
    MaxCrashes = 2
    MaxThirdRestarts = 1
    MaxInFlight = 2
    RecordStatement = TRUE
    LeaderStartsBarred = TRUE
    LeaderRecordsOwn = TRUE
    InstancesRecordFirst = TRUE
    ThirdKeepsRecord = TRUE
    MaxArbiterChanges = 1
    MaxArbiterLinkFailures = 1
    BothArbitersConfirm = TRUE
    ActiveConfirmsAlone = TRUE
    PassiveKnowsBehind = TRUE
SPECIFICATION Spec
CONSTRAINT InFlightBound
INVARIANTS
    TypeOK
    LeaderHoldsActed
