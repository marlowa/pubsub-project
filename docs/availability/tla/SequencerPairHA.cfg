\* Model checking configuration for SequencerPairHA.tla.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config SequencerPairHA.cfg SequencerPairHA.tla
\*
\* -deadlock turns off deadlock checking: once the failure budgets below are spent, a behaviour can
\* reach a state with nothing left to do, which is not an error.
\*
\* These settings are the ones findings.md calls "quiet": failures only after the pair has first
\* settled, and never while a message is in flight. Each finding in findings.md gives the budgets
\* and the single invariant that reproduce it; TLC stops at the first invariant violated.
CONSTANTS
    MaxEpoch = 3
    MaxCrashes = 1
    MaxLinkFailures = 1
    MaxArbiterRestarts = 0
    MaxAttempts = 2
    LateHeartbeats = FALSE
    DegradedPromotion = TRUE
    FailuresAfterStart = TRUE
    WithFixes = FALSE
    UniqueEpochs = FALSE
    LeaderStandsDown = FALSE
    ArbiterLiftsIncumbent = FALSE
    LateStart = FALSE
    Quiet = TRUE
SPECIFICATION Spec
CONSTRAINT EpochBound
INVARIANTS
    TypeOK
    NoTwoLeadersSharingAnEpoch
    EpochNamesOneLeader
    NoRegression
    FollowerCanNotice
    ArbiterNeverIssuesBelowItsRecord
