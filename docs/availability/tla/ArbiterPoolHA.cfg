\* Model checking configuration for ArbiterPoolHA.tla.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config ArbiterPoolHA.cfg ArbiterPoolHA.tla
\*
\* Quiet = TRUE: no failure while a message is in flight, and no timeout while one is in flight.
\* Each finding in findings.md gives the budgets and the single invariant that reproduce it.
CONSTANTS
    MaxEpoch = 4
    MaxArbiterCrashes = 1
    MaxWitnessCrashes = 0
    MaxLinkFailures = 1
    Quiet = TRUE
SPECIFICATION Spec
CONSTRAINT EpochBound
INVARIANTS
    TypeOK
    AtMostOneActive
    NoLastingTwoActive
    PassiveNotAheadOfActive
    PassiveCanNotice
