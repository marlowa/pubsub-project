\* Model checking configuration for MajorityLeaseHA.tla, the proposed design.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config MajorityLeaseHA.cfg MajorityLeaseHA.tla
\*
\* These are the design's settings: every rule on, and degraded self-promotion off. Section 11 of
\* findings.md gives the settings for each of the other checks, including those made to fail.
\* As set here, the run visits about 42 million states and takes about four minutes. Each extra
\* generation of epochs (MaxEpoch) multiplies that by about twenty.
CONSTANTS
    Lease = 2
    MaxEpoch = 0
    MaxCrashes = 1
    MaxThirdRestarts = 1
    MaxLinkFailures = 1
    ThirdUpAtStart = TRUE
    ThirdStaysDown = FALSE
    Prompt = FALSE
    HolderCountsFromSend = TRUE
    WaitOutOwnGrant = TRUE
    RestartWaits = TRUE
    InstancesKeepPromises = FALSE
    PeerVotes = TRUE
    CandidateYields = TRUE
    DegradedPromotion = FALSE
SPECIFICATION Spec
CONSTRAINT EpochBound
INVARIANTS
    TypeOK
    AtMostOneActing
    EpochNamesOneLeader
