\* Model checking configuration for MajorityLeaseHA.tla, the design the venue uses.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config MajorityLeaseHA.cfg MajorityLeaseHA.tla
\*
\* These are the settings the code uses: every rule on, degraded self-promotion off, and each instance
\* keeping its promises on disk (findings.md section 13.2). Section 11 of findings.md gives the settings for
\* each of the other checks, including those made to fail. As set here, the run visits about 414 million
\* states and takes about 47 minutes on 30 workers. With CandidateResends = FALSE it visits about 43 million
\* and takes about five minutes. Each extra generation of epochs (MaxEpoch) multiplies the count by about
\* twenty. TLC needs a heap of about 20 GB for it; give Java more than the machine's memory and the kernel
\* stops the run part way.
CONSTANTS
    Lease = 2
    MaxEpoch = 0
    MaxCrashes = 1
    MaxThirdRestarts = 1
    MaxLinkFailures = 1
    ThirdUpAtStart = TRUE
    ThirdStaysDown = FALSE
    Prompt = FALSE
    HolderCountsFromSend = TRUE
    WaitOutOwnGrant = TRUE
    RestartWaits = TRUE
    InstancesKeepPromises = TRUE
    PeerVotes = TRUE
    CandidateYields = TRUE
    CandidateResends = TRUE
    DegradedPromotion = FALSE
    RecordBeforeAsking = TRUE
SPECIFICATION Spec
CONSTRAINT EpochBound
INVARIANTS
    TypeOK
    AtMostOneActing
    EpochNamesOneLeader
