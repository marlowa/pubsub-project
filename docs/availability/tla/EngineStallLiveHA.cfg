\* Liveness check of MajorityLeaseHA.tla with the leading sequencer's statement that a matching engine has stopped
\* working and may not lead (docs/availability/a_matching_engine_that_stops_working.md; findings.md section 5).
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config EngineStallLiveHA.cfg MajorityLeaseHA.tla
\*
\* DeniedLeaderReplaced: if from some point the other engine and the arbiter both hold the statement for good, the
\* other engine comes to act as leader for good. As for every liveness check of this specification, Prompt is on, so
\* that every message arrives within the tick it was sent in, and fairness is assumed for every step the design takes.
\* As set here, one crash of an instance is allowed; findings.md section 5 also gives the result with none.
CONSTANTS
    Lease = 2
    MaxEpoch = 1
    MaxCrashes = 1
    MaxThirdRestarts = 0
    MaxLinkFailures = 0
    ThirdUpAtStart = TRUE
    ThirdStaysDown = FALSE
    Prompt = TRUE
    HolderCountsFromSend = TRUE
    WaitOutOwnGrant = TRUE
    RestartWaits = TRUE
    InstancesKeepPromises = TRUE
    PeerVotes = TRUE
    CandidateYields = TRUE
    CandidateResends = FALSE
    DegradedPromotion = FALSE
    RecordBeforeAsking = TRUE
    SequencerDenies = TRUE
    DenialRefusesRenewals = TRUE
    DenialOverridesYield = TRUE
SPECIFICATION LiveSpec
CONSTRAINT EpochBound
INVARIANTS
    AtMostOneActing
    DeniedLeaderStops
PROPERTIES
    DeniedLeaderReplaced
