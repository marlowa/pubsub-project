\* Model checking configuration for FollowerHandOver.tla: the hand-over as designed, comparing the position
\* the reading thread reports with the limit now.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config FollowerHandOver.cfg FollowerHandOver.tla
\*
\* Every property must hold. FollowerHandOverNoCompare.cfg checks the hand-over made on any report, in which
\* TLC must find a record the follower never receives. As set here, the run visits about 256,000 distinct
\* states and takes a second or two.
CONSTANTS
    MaxRecords = 7
    FollowerStart = 0
    MaxLosses = 2
    CompareOnReport = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoGapNoRepeat
    NeverAboveLimit
    NothingMissedAtHandOver
