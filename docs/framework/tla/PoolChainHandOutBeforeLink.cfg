\* Model checking configuration for PoolChain.tla: the fault of handing out a node from a new pool before linking it: TLC must find a node whose pool is not in the chain.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   mkdir -p states && java -Djava.io.tmpdir=states -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config PoolChainHandOutBeforeLink.cfg PoolChain.tla
CONSTANTS
    Producers = {p1, p2, p3}
    MaxPools = 4
    NodesPerPool = 1
    MaxQueued = 3
    HandOutBeforeLink = TRUE
    LinkByCompareAndSwap = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ChainAcyclic
    LinkedAtMostOnce
    EveryNodeInTheChain
    NeverLost
    NeverTakenTwice
    NoPoolLost
