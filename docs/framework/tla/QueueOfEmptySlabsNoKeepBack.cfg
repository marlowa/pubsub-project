\* Model checking configuration for QueueOfEmptySlabs.tla with the owner destroying every slab it takes
\* at once, instead of keeping back the last one taken.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config QueueOfEmptySlabsNoKeepBack.cfg QueueOfEmptySlabs.tla
\*
\* TLC must report that NoUseAfterFree is violated. This shows why the owner keeps back the last slab it
\* takes, and that the specification can find the fault that keeping it back prevents.
CONSTANTS
    NumSlabs = 5
    KeepLastTaken = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoUseAfterFree
