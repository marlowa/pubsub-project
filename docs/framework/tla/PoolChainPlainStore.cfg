\* Model checking configuration for PoolChain.tla: the fault of linking by a plain store: TLC must find a pool cut out of the chain.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config PoolChainPlainStore.cfg PoolChain.tla
CONSTANTS
    Producers = {p1, p2, p3}
    MaxPools = 4
    NodesPerPool = 1
    MaxQueued = 3
    HandOutBeforeLink = FALSE
    LinkByCompareAndSwap = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ChainAcyclic
    LinkedAtMostOnce
    EveryNodeInTheChain
    NeverLost
    NeverTakenTwice
    NoPoolLost
