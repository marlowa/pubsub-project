\* Model checking configuration for PoolChain.tla: the chain as designed: every property must hold.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   mkdir -p states && java -Djava.io.tmpdir=states -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config PoolChain.cfg PoolChain.tla
\* As set here, the run visits 25,489,848 distinct states and takes under three minutes on 32 workers.
CONSTANTS
    Producers = {p1, p2, p3}
    MaxPools = 4
    NodesPerPool = 1
    MaxQueued = 3
    HandOutBeforeLink = FALSE
    LinkByCompareAndSwap = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ChainAcyclic
    LinkedAtMostOnce
    EveryNodeInTheChain
    NeverLost
    NeverTakenTwice
    NoPoolLost
    PoolsBounded
