\* Model the outer allocator's invalid-pointer and already-free checks.
\*
\* Run from this directory:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config PoolFreeValidation.cfg PoolFreeList.tla
\*
\* Free requests may come from any thread. Null pointers, non-pool pointers,
\* and pointers to slots that are not allocated are rejected before a slot
\* is pushed onto the free list.
CONSTANTS
    NumSlots = 2
    Threads = {t1, t2}
    MaxHeld = 1
    UseCounter = TRUE
    ModelFreeValidation = TRUE
    MaxCounter = 8
SPECIFICATION Spec
CONSTRAINT CounterBound
INVARIANTS
    TypeOK
    NeverTakenTwice
    FreeListSound
    NothingLost
