\* Model checking configuration for PoolChain.tla: the chain as designed, with pools of two nodes, so that a pool can be partly used while producers race past it: every property must hold.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config PoolChainTwoNodes.cfg PoolChain.tla
\* As set here, the run visits 5,067,730 distinct states and takes under half a minute on 32 workers.
CONSTANTS
    Producers = {p1, p2, p3}
    MaxPools = 3
    NodesPerPool = 2
    MaxQueued = 4
    HandOutBeforeLink = FALSE
    LinkByCompareAndSwap = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ChainAcyclic
    LinkedAtMostOnce
    EveryNodeInTheChain
    NeverLost
    NeverTakenTwice
    NoPoolLost
