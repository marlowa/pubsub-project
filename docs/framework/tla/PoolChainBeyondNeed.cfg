\* Model checking configuration for PoolChain.tla: the chain as designed, checked against the tighter claim that no pool is added beyond what the nodes in use needed: TLC must break it, showing how producers arriving at once add a pool more than was needed.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config PoolChainBeyondNeed.cfg PoolChain.tla
CONSTANTS
    Producers = {p1, p2, p3}
    MaxPools = 4
    NodesPerPool = 1
    MaxQueued = 3
    HandOutBeforeLink = FALSE
    LinkByCompareAndSwap = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ChainAcyclic
    LinkedAtMostOnce
    EveryNodeInTheChain
    NeverLost
    NeverTakenTwice
    NoPoolLost
    NoPoolBeyondNeed
