\* Model checking configuration for QueueOfEmptySlabs.tla: the queue of empty slabs, with the owner keeping
\* back the last slab it takes, as the code does.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config QueueOfEmptySlabs.cfg QueueOfEmptySlabs.tla
\*
\* Every property must hold. QueueOfEmptySlabsNoKeepBack.cfg checks the same queue with the owner
\* destroying every slab it takes at once, in which TLC must find a node used after its slab was destroyed.
\* As set here, the run visits about 170,000 distinct states and takes a second or two.
CONSTANTS
    NumSlabs = 5
    KeepLastTaken = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoUseAfterFree
    TakenAtMostOnce
    NothingLost
