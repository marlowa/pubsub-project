\* Model checking configuration for SlabReclaim.tla: the slab allocator's design before BUG-0157 was fixed.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config SlabReclaimBeforeBug0157.cfg SlabReclaim.tla
\*
\* TLC must report that NoUseAfterFree is violated: a thread that freed a slab's last chunk reads the slab
\* after the owner destroyed it. This shows the specification can find the fault that BUG-0157 describes.
CONSTANTS
    Design = "before_bug_0157"
    MaxChunks = 5
    MaxSlabs = 5
    Capacity = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoUseAfterFree
