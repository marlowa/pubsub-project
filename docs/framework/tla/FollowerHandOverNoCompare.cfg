\* Model checking configuration for FollowerHandOver.tla with the owning thread handing the follower over on
\* any report, without comparing the position reported with the limit now.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config FollowerHandOverNoCompare.cfg FollowerHandOver.tla
\*
\* TLC must report that NothingMissedAtHandOver or NoGapNoRepeat is violated: a record released while the
\* reading thread was finishing is never sent.
CONSTANTS
    MaxRecords = 7
    FollowerStart = 0
    MaxLosses = 2
    CompareOnReport = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoGapNoRepeat
    NeverAboveLimit
    NothingMissedAtHandOver
