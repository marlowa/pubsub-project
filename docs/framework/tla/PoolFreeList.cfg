\* Model checking configuration for PoolFreeList.tla: the pool's free list as the code has it, with the
\* counter compared by the exchange.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config PoolFreeList.cfg PoolFreeList.tla
\*
\* Every property must hold. PoolFreeListNoCounter.cfg checks the same free list with the exchange comparing
\* only the pointer, in which TLC must find a slot taken while another thread holds it. As set here, the run
\* visits about 13.7 million distinct states and takes under half a minute on 16 workers.
CONSTANTS
    NumSlots = 3
    Threads = {t1, t2, t3}
    MaxHeld = 2
    UseCounter = TRUE
    MaxCounter = 7
SPECIFICATION Spec
CONSTRAINT CounterBound
INVARIANTS
    TypeOK
    NeverTakenTwice
    FreeListSound
    NothingLost
