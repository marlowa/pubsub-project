\* Model checking configuration for SlabReclaim.tla: the slab allocator's design now.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config SlabReclaim.cfg SlabReclaim.tla
\*
\* Every property must hold. SlabReclaimBeforeBug0157.cfg checks the design before BUG-0157 was fixed,
\* in which TLC must find the use after free. One chunk to a slab makes every allocation after the first
\* switch to a new slab, which gives the most switches for the chunks allowed. As set here, the run visits
\* about 1.1 million distinct states and takes a few seconds on 16 workers.
CONSTANTS
    Design = "now"
    MaxChunks = 7
    MaxSlabs = 7
    Capacity = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoUseAfterFree
    CurrentNeverDestroyed
    QueuedAtMostOnce
    DestroyedOnlyWhenEmpty
    NothingLost
