\* Model checking configuration for PoolFreeList.tla with the exchange comparing only the pointer, as a
\* free list without the counter would.
\*
\* Run from this directory, with tla2tools.jar from https://github.com/tlaplus/tlaplus/releases:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -workers auto -config PoolFreeListNoCounter.cfg PoolFreeList.tla
\*
\* TLC must report that NeverTakenTwice or FreeListSound is violated: the fault the counter prevents.
CONSTANTS
    NumSlots = 3
    Threads = {t1, t2}
    MaxHeld = 2
    UseCounter = FALSE
    MaxCounter = 10
SPECIFICATION Spec
CONSTRAINT CounterBound
INVARIANTS
    TypeOK
    NeverTakenTwice
    FreeListSound
