# A compressed trading day. See docs/operations/trading_day_load.md.
#
# Phase rates are FRACTIONS of ceiling_orders_per_second, never absolute, so the same
# profile means the same thing on a machine with different capacity. Measure the ceiling
# on this box and set it below.
#
# Compression applies ONLY to phases with compressible = true -- the quiet ones. Bursts
# keep their real durations because their durations are what is being tested, and the
# sustained phase is never compressed because accumulation needs real elapsed time.
#
# cancel_ratio is a MEMORY DIAL, not an attempt at a realistic cancel-to-order ratio.
# It sets what fraction of orders leave the book, so the resting count -- and therefore
# the venue's memory -- is offered x (1 - cancel_ratio). The low value here exists to
# reach the next growth step of the order book within one run. A ratio resembling a real
# venue's leaves the book too small to rehash again, and the rehash is the thing under
# test. A run that is about latency rather than memory should raise it.

[run]
ceiling_orders_per_second = 3500   # PROVISIONAL -- calibrate on this machine
compression               = 6      # quiet phases only
chart_step_seconds        = 30     # must match pubsub_metrics.py --step
minimum_samples           = 6      # per phase; sets the floor a phase may not fall below

[[phase]]
name         = "pre-open"
pattern      = "steady"
duration     = "20m"               # 200s after 6x compression
compressible = true
rate         = 0.05
cancel_ratio = 0.10

[[phase]]
name         = "open auction"
pattern      = "uniform_slowdown"
duration     = "4m"
compressible = false
rate         = 1.0
cancel_ratio = 0.10                 # at the ceiling: the venue should be working hard

[[phase]]
name         = "morning steady"
pattern      = "steady"
duration     = "20m"
compressible = true
rate         = 0.30
cancel_ratio = 0.10

# The event of interest, and the reason this run takes an hour and a half. Never
# compressed: accumulation -- slab growth, WAL, monotonic degradation -- cannot be
# measured in less elapsed time than it takes to accumulate.
#
# The duration is set by where the order book's growth steps fall. The book is a
# power-of-two-growth hash table, so its cost is a step function of the resting order
# count, and the steps are the only moments that test anything: each one rehashes the
# whole table on the reactor callback thread while holding the old table and the new
# one at once. Ninety minutes here leaves 10.3M orders resting, which crosses the
# 2^23 step about seventy minutes in -- with the rest of the run still to come, so the
# recovery is observable rather than coinciding with the closing bell.
[[phase]]
name         = "sustained elevated"
pattern      = "uniform_slowdown"
duration     = "90m"
compressible = false
rate         = 0.55
cancel_ratio = 0.10

[[phase]]
name         = "midday lull"
pattern      = "volume_collapse"
duration     = "30m"               # 300s after compression
compressible = true
rate         = 0.02                # percentiles should NOT move here -- only volume

[[phase]]
name         = "afternoon burst"
pattern      = "uniform_slowdown"
duration     = "3m"
compressible = false
rate         = 0.95
cancel_ratio = 0.10

[[phase]]
name         = "close"
pattern      = "uniform_slowdown"
duration     = "4m"
compressible = false
rate         = 1.1
cancel_ratio = 0.10                 # deliberately above ceiling: a stress phase
