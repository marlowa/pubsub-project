# environments/test-1.toml
#
# Test cluster 1.  Full HA topology on dedicated test machines.
# Differences from preprod/prod:
#   - Self-signed TLS certificates (deploy.py generates them; no CA required).
#   - cpu_pinning_reserve_cpu0 = true: test machines are not CPU-isolated, so
#     CPU 0 is reserved for OS use and excluded from pinning candidates.
#   - Hostnames use the test-1 namespace.
#
# Fill in the actual hostnames/IPs before running deploy.py.
# Lines marked REPLACE must be changed.
#
# Consumed by:
#   deploy.py --env environments/test-1.toml --artefact pubsub-<ver>.tar.gz \
#             --install-dir /opt/pubsub

[env]
name        = "test-1"
description = "Test cluster 1. Full HA topology on dedicated test machines."

# ── Paths ─────────────────────────────────────────────────────────────────────
# Everything this deployment owns lives under one root, /opt/pubsub: binaries,
# configs, certs, logs, PID files and the WALs.  One root means the whole tree is
# a single container volume or a single unit to move, back up or wipe, and it
# keeps a deployment from scattering state across /var that nothing tracks.
#
# For rollback, make /opt/pubsub itself the symlink and switch it between
# versioned trees.  Note what that implies: the WALs below move with the symlink.
# That is fine for a test cluster, but for a live venue the sequencer WAL is the
# authoritative record of accepted orders and must not change when the code
# version does -- point wal_directory at a path outside the versioned tree
# (/opt/pubsub-state/... or a dedicated mount) before running for real.

[paths]
install_dir = "/opt/pubsub"
log_dir     = "/opt/pubsub/log"
run_dir     = "/opt/pubsub/run"

# ── Database ──────────────────────────────────────────────────────────────────

[db]
host = "db.test-1.exchange.internal"  # REPLACE
port = 5432
name = "pubsub"
user = "pubsub_app"

# ── High availability ─────────────────────────────────────────────────────────

[ha]
enabled = true

# ── TLS certificates ──────────────────────────────────────────────────────────
# deploy.py generates self-signed certificates for the test cluster.
# No CA is required; client certificate verification is disabled (ca = "").
# Run deploy.py without --skip-certs to (re)generate certs on first deploy.

[tls.auth_service_a]
cert = "admin.crt"
key  = "admin.key"
ca   = ""

[tls.auth_service_b]
cert = "admin.crt"
key  = "admin.key"
ca   = ""

# ── Components ────────────────────────────────────────────────────────────────

# hot_path_rank declares the order in which entitlement to a dedicated CPU core is
# surrendered when a machine cannot satisfy every component.  It is a property of
# the instance, not of the machine, so the same value is used in every
# environment; where the cut falls is computed per machine by deploy.py.  Absence
# of hot_path_rank means the component's threads run in the shared background
# tier, which is the safe default.
#
# A rank group is admitted whole or not at all, so both gateways (rank 1) can
# never be split across core types.  Both share one host here, so that rule is
# doing real work in this environment rather than being a formality.
#
#   1  fix_order_gateway_a, binary_order_gateway_a   client edge
#   2  sequencer_primary/_secondary    the sequencing point; the follower's WalAck
#                                      gates every execution report, so it is
#                                      latency-critical despite not being
#                                      mandatory for trading
#   3  matching_engine                 matching
#
# No thread counts appear here.  The application knows how many threads it
# registers with the Reactor; deploy.py asks the binary rather than reading a
# figure that would drift silently.
#
# See docs/design/cpu_pinning_anti_affinity.md.

[startup_order]
components = [
    "auth_service_a",
    "auth_service_b",
    "witness",
    "arbiter_primary",
    "arbiter_secondary",
    "matching_engine",
    "sequencer_primary",
    "sequencer_secondary",
    "fix_order_gateway_a",
    "binary_order_gateway_a",
    "admin_service",
]

# ── Machine layout ────────────────────────────────────────────────────────────
# Which processes run on which host.  deploy.py runs on the target machine, reads
# that machine's real CPU topology, and resolves the hot_path_rank values above
# into concrete core ids -- so the same declaration serves hosts of different
# sizes and survives a hardware refresh.
#
# Hostnames must match the *_host values further down.  REPLACE them together.
#
# minimum_background_cores is a floor on the shared tier, not an apportionment of
# the machine.  Background cores are where everything not pinned actually runs --
# the Quill backend, and later the Prometheus scrape thread -- so the value is
# small on every host regardless of its size.  Its first job is correctness: the
# background pool must never be empty, because an empty CPU affinity mask is
# EINVAL and every process has at least a Quill backend needing somewhere to run.
# On a dedicated host wanting two cores out of twenty it never binds.

[machines."auth-primary.test-1.exchange.internal"]  # REPLACE
components               = ["auth_service_a"]
minimum_background_cores = 2

[machines."auth-secondary.test-1.exchange.internal"]  # REPLACE
components               = ["auth_service_b"]
minimum_background_cores = 2

[machines."witness.test-1.exchange.internal"]  # REPLACE
components               = ["witness"]
minimum_background_cores = 2

[machines."arbiter-primary.test-1.exchange.internal"]  # REPLACE
components               = ["arbiter_primary"]
minimum_background_cores = 2

[machines."arbiter-secondary.test-1.exchange.internal"]  # REPLACE
components               = ["arbiter_secondary"]
minimum_background_cores = 2

[machines."matching-engine.test-1.exchange.internal"]  # REPLACE
components               = ["matching_engine"]
minimum_background_cores = 2

[machines."sequencer-primary.test-1.exchange.internal"]  # REPLACE
components               = ["sequencer_primary"]
minimum_background_cores = 2

[machines."sequencer-secondary.test-1.exchange.internal"]  # REPLACE
components               = ["sequencer_secondary"]
minimum_background_cores = 2

[machines."gateway.test-1.exchange.internal"]  # REPLACE
components               = ["fix_order_gateway_a", "binary_order_gateway_a"]
minimum_background_cores = 2

[machines."admin.test-1.exchange.internal"]  # REPLACE
components               = ["admin_service"]
minimum_background_cores = 2

[components.auth_service_a]
binary  = "bin/authentication_service"
config  = "etc/authentication_service/authentication_service_a.toml"
workdir = "etc/authentication_service"
ha_only = false

[components.auth_service_b]
binary  = "bin/authentication_service"
config  = "etc/authentication_service/authentication_service_b.toml"
workdir = "etc/authentication_service"
ha_only = true

[components.witness]
binary  = "bin/witness"
config  = "etc/witness/witness.toml"
workdir = "etc/witness"
ha_only = true

[components.arbiter_primary]
binary  = "bin/arbiter"
config  = "etc/arbiter/arbiter.toml"
workdir = "etc/arbiter"
ha_only = true

[components.arbiter_secondary]
binary  = "bin/arbiter"
config  = "etc/arbiter/arbiter_secondary.toml"
workdir = "etc/arbiter"
ha_only = true

[components.matching_engine]
binary  = "bin/matching_engine"
config  = "etc/matching_engine/matching_engine.toml"
workdir = "etc/matching_engine"
ha_only = false
hot_path_rank = 3

[components.sequencer_primary]
binary  = "bin/sequencer"
config  = "etc/sequencer/sequencer.toml"
workdir = "etc/sequencer"
ha_only = false
hot_path_rank = 2

[components.sequencer_secondary]
binary  = "bin/sequencer"
config  = "etc/sequencer/sequencer_secondary.toml"
workdir = "etc/sequencer"
ha_only = true
hot_path_rank = 2

[components.fix_order_gateway_a]
binary  = "bin/fix_order_gateway"
config  = "etc/fix_order_gateway/fix_order_gateway_a.toml"
workdir = "etc/fix_order_gateway"
ha_only = false
hot_path_rank = 1

[components.binary_order_gateway_a]
binary  = "bin/binary_order_gateway"
config  = "etc/binary_order_gateway/binary_order_gateway_a.toml"
workdir = "etc/binary_order_gateway"
ha_only = false
hot_path_rank = 1

[components.admin_service]
jar     = "lib/admin-service.jar"
config  = "etc/admin_service/application.properties"
workdir = "etc/admin_service"
ha_only = false

# ── Template substitution values ──────────────────────────────────────────────

[shared]
# Metrics for the whole venue. One edit turns the scrape endpoints on or off
# everywhere; each component still has its own listener host and port below.
metrics_enabled     = false
metrics_application = "pubsub"
# Bucket bounds in nanoseconds for the order round-trip histogram, which every order
# gateway registers. Declared once here and expanded into each gateway's file because
# the metric exists to compare the FIX gateway against the binary one: histograms with
# different bounds cannot be compared or aggregated, so a per-gateway value would make
# the comparison meaningless the first time one of them was tuned alone.
# The range has to span TWO regimes, which is what earlier, narrower bounds got wrong.
#
#   Service time -- a rate-limited run, where the pipeline keeps up. Round trips of 119,
#   356 and 528 microseconds were recorded at 4, 20 and 40 concurrent sessions. This is the
#   regime the FIX-versus-binary comparison lives in, so the microsecond end needs fine
#   resolution or an improvement disappears into one bucket.
#
#   Queueing -- a saturating throughput run, which is what perf_run.py does by default:
#   it offers load faster than the pipeline drains, deliberately. A 20,000-order run
#   measured a mean of 101ms, and against bounds topping out at 100ms fully 59% of
#   observations landed in the overflow bucket, leaving no usable percentile at all.
#
#   Outage -- an order caught across a failover. The sequencer defers orders while no
#   matching engine is connected and the promoted one replays them, so the round trip is
#   the length of the outage, not a latency at all. A trading-day run put 223,824 orders
#   (1.87%) past the old 5s top bound, and the histogram's _sum -- which counts the
#   overflow even though the buckets do not -- puts their MEAN at 62s or more. Against
#   bounds topping out at 5s the whole population was unmeasurable, and the p99 read as a
#   flat 5000ms clamp: histogram_quantile returns the highest finite bound when the
#   quantile falls in the overflow, so the chart reported the largest number it could
#   express rather than what happened.
#
# Resolution above a minute is deliberately coarse. By then the question is no longer how
# slow but whether an order was caught in an outage, and 50s-250s is one bucket because
# the difference between 90s and 200s changes no decision.
#
# The top bound matters for a second reason: an overflow bucket should be rare enough that
# reaching it is itself the finding. At 5s it held 1.87% of an ordinary run, which makes it
# a bucket rather than an overflow, and nothing about a value landing there was remarkable.
#
# Covering all three costs nine extra series per gateway, which is nothing, and the
# alternative are bucket bounds that are useless in whichever regime is not being run
# that day.
metrics_order_round_trip_buckets = [
    10000, 25000, 50000, 100000,          # 10us 25us 50us 100us   -- service time
    250000, 500000, 1000000, 2500000,     # 250us 500us 1ms 2.5ms
    5000000, 10000000, 25000000,          # 5ms 10ms 25ms
    50000000, 100000000, 250000000,       # 50ms 100ms 250ms       -- queueing
    500000000, 1000000000, 2500000000,    # 500ms 1s 2.5s
    5000000000,                           # 5s                     -- a genuine stall
    10000000000, 25000000000,             # 10s 25s                -- outage, not latency
    50000000000, 250000000000 ]           # 50s 250s               -- caught across a failover
# true: CPU 0 is excluded from pinning candidates on non-isolated test machines.
reactor_cpu_pinning_reserve_cpu0   = true
# The CPU registry file and its lock live under install_dir/run/ and are set
# by deploy.py, which is the single place that knows the install layout.  They
# are deliberately not configurable here: two installations on one machine must
# not share a registry.

