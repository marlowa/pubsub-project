# environments/dev.toml
#
# Single-machine developer sandbox.
# All components run on localhost with the same TLS settings as production.
# This is NOT a production deployment config — it is a convenience tool for
# local development only.  In production each component runs on its own host.
#
# Consumed by:
#   deploy.py --env environments/dev.toml
#   devenv.py --env environments/dev.toml   (default)
#   build.py  --install                     (uses dev defaults equivalent to this file)

[env]
name        = "dev"
description = "Single-machine developer sandbox. All components on localhost."

# ── Paths ─────────────────────────────────────────────────────────────────────
# Relative paths are resolved from the project root (the directory that
# contains the environments/ folder).

[paths]
install_dir = "installed"     # binaries, component configs, certs
log_dir     = "installed/log" # component stdout/stderr and applog files
run_dir     = "installed/run"        # PID files written here by devenv.py

# ── Database ──────────────────────────────────────────────────────────────────
# Used by deploy.py (runs create_db.py and export_credentials.py) and by
# devenv.py (re-exports credentials before starting the auth service).
# Password: set PUBSUB_APP_DB_PASSWORD in the environment; falls back to
# the dev default "pubsub_dev" if unset.

[db]
host = "localhost"
port = 5432
name = "pubsub"
user = "pubsub_app"

# ── High availability ─────────────────────────────────────────────────────────
# When enabled = true, all components marked ha_only = true are started.
# Pass --no-ha to devenv.py to override for a quick single-instance session.
# In production HA is always on.

[ha]
# The venue-wide high-availability switch, and the ONLY one.
#
# devenv.py reads it to decide which components to launch, and deploy.py expands it into every
# component config that has an opinion about high availability -- the sequencer pair's ha_enabled
# and the matching engine's. One value, one meaning, everywhere.
#
# It was not always so. The sequencer's template hardcoded ha_enabled = true and the matching
# engine read a separate [matching_engine] ha_enabled, so a venue started with high availability
# off launched no arbiters while its sequencer waited for one, never became leader, and forwarded
# no orders at all -- while acknowledging every member and logging nothing wrong. See
# docs/bug_list.md, BUG-0061. Adding a per-component key for the sequencer would have made a third
# place to disagree, which is the shape of the bug rather than a fix for it.
enabled = true

# ── FIX client credentials ────────────────────────────────────────────────────
# Provisioned into the auth service database at deploy time.  deploy.py derives
# fresh SCRAM-SHA-256 material from each plaintext password and writes it
# directly to the database, making this the single authoritative source.
# The subsequent export_credentials.py step then exports correct values.
# In production, inject the password via an environment variable or secrets
# manager rather than storing it here in plain text.

[[fix_credentials]]
comp_id  = "APM001"
password = "stubpassword"

# ── TLS certificates ──────────────────────────────────────────────────────────
# Each [tls.<name>] section generates a self-signed cert/key pair during deploy.
# The section name must match a key in [components.*]; cert and key paths are
# resolved relative to that component's workdir in the install tree.
#
# Paths are relative to each component's working directory (its
# etc/<component>/ directory within the install tree), matching the relative
# paths already used in the component TOML configs.
#
# In dev: deploy.py generates self-signed certs and writes them into the
# install tree at these paths.
#
# In production: replace with paths to certs issued by your CA, and set
# ca to the path of the CA certificate if client certificate verification
# is required.

[tls.auth_service_a]
cert = "admin.crt"
key  = "admin.key"
ca   = ""

[tls.auth_service_b]
cert = "admin.crt"
key  = "admin.key"
ca   = ""

[tls.fix_order_gateway_a]
cert = "fix_gateway.crt"
key  = "fix_gateway.key"
ca   = ""

[tls.fix_order_gateway_b]
cert = "fix_gateway.crt"
key  = "fix_gateway.key"
ca   = ""

# ── Components ────────────────────────────────────────────────────────────────
# binary and config paths are relative to install_dir.
# workdir is the process working directory at launch, relative to install_dir.
# Components that reference certs or data files by relative path in their
# TOML must be started from the directory containing those files.
# ha_only = true: component is skipped when HA is disabled.
#
# hot_path_rank declares the order in which entitlement to a dedicated CPU core is
# surrendered when a machine cannot satisfy every component.  It is a property of
# the instance, not of the machine, so the same value is used in every
# environment; where the cut falls is computed per machine by deploy.py.  Absence
# of hot_path_rank means the component's threads run in the shared background
# tier, which is the safe default -- forgetting to rank something places it where
# it almost certainly belonged.
#
# A rank group is admitted whole or not at all, so the two measured gateways
# (rank 1) can never be split across core types.  That is what makes the
# FIX-versus-binary comparison valid by construction rather than by arithmetic
# accident.  Only the _a instance of each protocol is ranked: perf_run.py measures
# _a, and ranking all four would spend two hot cores on processes that are idle
# during the comparison.  The _b instances are unranked and so run in the shared
# background tier, which is also what makes them cheap to leave running.
#
#   1  fix_order_gateway_a,              client edge
#      binary_order_gateway_a
#   2  sequencer_primary/_secondary      the sequencing point; the follower's
#                                        WalAck gates every execution report, so
#                                        it is latency-critical despite not being
#                                        mandatory for trading
#   3  matching_engine_primary           matching
#   4  mep_primary, mep_secondary        downstream of the ER path
#   5  matching_engine_secondary         BookUpdate is fire-and-forget, so this
#                                        one yields first
#
# No thread counts appear here.  The application knows how many threads it
# registers with the Reactor; deploy.py asks the binary rather than reading a
# figure that would drift silently.

# Startup order is listed explicitly here so devenv.py can start components
# in dependency order and wait for each to be ready before proceeding.
# Shutdown is performed in reverse order.
#
# Dependencies:
#   auth_service        — no outbound; gateway depends on it
#   witness             — no outbound; arbiters depend on it
#   arbiter             — connects to witness and peer; sequencers depend on it
#   matching_engine     — listens for sequencer; also connects back to sequencer
#                         ER ports (retries until ready)
#   sequencer           — connects to arbiter and matching_engine
#   gateway             — connects to auth_service and sequencer
#   admin_service       — independent; started last for convenience

[startup_order]
components = [
    "auth_service_a",
    "auth_service_b",
    "witness",
    "arbiter_primary",
    "arbiter_secondary",
    "matching_engine_primary",
    "matching_engine_secondary",
    "sequencer_primary",
    "sequencer_secondary",
    "mep_primary",
    "mep_secondary",
    "fix_order_gateway_a",
    "fix_order_gateway_b",
    "binary_order_gateway_a",
    "binary_order_gateway_b",
    "admin_service",
    "fix_test_client",
    # Last, so it is scraping a venue that is already up. Nothing depends on the ordering --
    # a target that is not listening yet simply reads `up 0` until it is -- but it keeps the
    # first samples of every run from being a picture of the venue still starting.
    #
    # Deliberately absent from [machines.localhost] below: that list drives CPU-layout
    # resolution, which reads each component's binary to learn its hot-path thread count,
    # and Prometheus is not one of ours to interrogate. It still lands on the background
    # cores, because devenv.py wraps every process it starts in the background tier.
    "prometheus",
]

# ── Machine layout ────────────────────────────────────────────────────────────
# Which processes run on which host.  deploy.py reads this on the target machine,
# reads that machine's real CPU topology, and resolves the hot_path_rank values
# below into concrete core ids.  See docs/framework/cpu_pinning_anti_affinity.md.
#
# Every process is listed, not only those that pin.  A process absent from this
# list gets no background mask and is therefore free to be scheduled onto the
# cores that hot-path threads are pinned to -- which is the current behaviour of
# the seven components here that claim nothing, fix_test_client included.
#
# minimum_background_cores is inert on the development workstation and binding
# elsewhere, which is why it is declared rather than omitted.  This workstation is
# a hybrid CPU: cores 0-15 are P-cores and 16-31 are E-cores, and hot-path threads
# only ever occupy P-cores, so the hot-path pool cannot exceed the 15 claimable
# P-cores and the background pool cannot fall below the 16 E-cores.  The P-core
# ceiling binds first and any floor from 0 to 16 gives an identical layout here.
#
# It is not neutral on a uniform-core machine running this same consolidated
# layout, where the floor is the only thing capping hot-path growth.  At 6 the cut
# falls after rank 3 on a 20-core host: ten hot-path threads, nine background.
# With no floor at all the same file would admit ranks 4 and 5 there and leave
# three background cores for two JVMs and thirteen Quill backends.

[machines.localhost]
minimum_background_cores = 6
components = [
    "auth_service_a",
    "auth_service_b",
    "witness",
    "arbiter_primary",
    "arbiter_secondary",
    "matching_engine_primary",
    "matching_engine_secondary",
    "sequencer_primary",
    "sequencer_secondary",
    "mep_primary",
    "mep_secondary",
    "fix_order_gateway_a",
    "fix_order_gateway_b",
    "binary_order_gateway_a",
    "binary_order_gateway_b",
    "admin_service",
    "fix_test_client",
]

[components.auth_service_a]
binary  = "bin/authentication_service"
config  = "etc/authentication_service/authentication_service_a.toml"
workdir = "etc/authentication_service"
ha_only = false

[components.auth_service_b]
binary  = "bin/authentication_service"
config  = "etc/authentication_service/authentication_service_b.toml"
workdir = "etc/authentication_service"
ha_only = true

[components.witness]
binary  = "bin/witness"
config  = "etc/witness/witness.toml"
workdir = "etc/witness"
ha_only = true

[components.arbiter_primary]
binary  = "bin/arbiter"
config  = "etc/arbiter/arbiter_primary.toml"
workdir = "etc/arbiter"
ha_only = true

[components.arbiter_secondary]
binary  = "bin/arbiter"
config  = "etc/arbiter/arbiter_secondary.toml"
workdir = "etc/arbiter"
ha_only = true

[components.matching_engine_primary]
binary  = "bin/matching_engine"
config  = "etc/matching_engine/matching_engine_primary.toml"
workdir = "etc/matching_engine"
ha_only = false
hot_path_rank = 3

[components.matching_engine_secondary]
binary  = "bin/matching_engine"
config  = "etc/matching_engine/matching_engine_secondary.toml"
workdir = "etc/matching_engine"
ha_only = true
hot_path_rank = 5

[components.sequencer_primary]
binary  = "bin/sequencer"
config  = "etc/sequencer/sequencer_primary.toml"
workdir = "etc/sequencer"
ha_only = false
hot_path_rank = 2

[components.sequencer_secondary]
binary  = "bin/sequencer"
config  = "etc/sequencer/sequencer_secondary.toml"
workdir = "etc/sequencer"
ha_only = true
hot_path_rank = 2

[components.mep_primary]
binary  = "bin/matching_engine_publisher"
config  = "etc/matching_engine_publisher/matching_engine_publisher_primary.toml"
workdir = "etc/matching_engine_publisher"
ha_only = false
hot_path_rank = 4

[components.mep_secondary]
binary  = "bin/matching_engine_publisher"
config  = "etc/matching_engine_publisher/matching_engine_publisher_secondary.toml"
workdir = "etc/matching_engine_publisher"
ha_only = true
hot_path_rank = 4

[components.fix_order_gateway_a]
binary  = "bin/fix_order_gateway"
config  = "etc/fix_order_gateway/fix_order_gateway_a.toml"
workdir = "etc/fix_order_gateway"
ha_only = false
hot_path_rank = 1

[components.fix_order_gateway_b]
binary  = "bin/fix_order_gateway"
config  = "etc/fix_order_gateway/fix_order_gateway_b.toml"
workdir = "etc/fix_order_gateway"

[components.binary_order_gateway_a]
binary  = "bin/binary_order_gateway"
config  = "etc/binary_order_gateway/binary_order_gateway_a.toml"
workdir = "etc/binary_order_gateway"
ha_only = false
hot_path_rank = 1

[components.binary_order_gateway_b]
binary  = "bin/binary_order_gateway"
config  = "etc/binary_order_gateway/binary_order_gateway_b.toml"
workdir = "etc/binary_order_gateway"

# The admin service JAR is placed in install_dir/lib/ by build.py.
# workdir is etc/admin_service/ so that relative paths in application.properties
# (e.g. admin.users-file = admin_users.toml) resolve there.  Spring Boot reads
# application.properties from the JAR classpath; no config arg is needed.
[components.admin_service]
jar     = "lib/admin-service.jar"
workdir = "etc/admin_service"
ha_only = false

# The fix-test-client JAR is placed in install_dir/lib/ by build.py.
# Its config file (app.toml) is passed as the first positional argument; the
# session config path inside app.toml is relative to workdir.
[components.fix_test_client]
jar     = "lib/fix-test-client.jar"
config  = "etc/fix_test_client/config/app.toml"
workdir = "etc/fix_test_client"
ha_only = false

# The metrics collector. Not a venue component: it observes the venue rather than taking
# part in it, which is what metrics_only marks. `devenv.py --no-prometheus` skips it, and it
# is skipped automatically on any host with no prometheus on PATH -- a trading system must
# not refuse to start because a monitoring tool is absent.
#
# 'command' (rather than binary/jar) means an external tool taken from PATH, with its
# arguments given verbatim because they follow Prometheus's conventions rather than this
# project's <log> <config> pair. {run_dir} and {install_dir} are substituted at launch.
#
# The scrape config is GENERATED into {run_dir}/prometheus.yml on every start, with its
# targets read out of the deployed component configs. A hand-written target list would be a
# second copy of facts that already live in those files, and it would fail silently: a new
# component would simply never appear in a dashboard.
[components.prometheus]
command      = "prometheus"
workdir      = "etc"
metrics_only = true
ha_only      = false
args = [
    "--config.file={run_dir}/prometheus.yml",
    # Storage sits outside installed/, which is a staging tree that gets rebuilt and does
    # not prune. Measurement history worth comparing across weeks should not live somewhere
    # a redeploy might disturb.
    "--storage.tsdb.path={install_dir}/../var/prometheus",
    # Well past the 15-day default: the value here is comparing a run today against one from
    # a fortnight ago, and the default quietly eats exactly that. At fifteen targets on a 5s
    # interval this is well under a gigabyte even if the venue ran continuously.
    "--storage.tsdb.retention.time=90d",
    "--web.listen-address=127.0.0.1:9090",
]

# Settings for the generated scrape config (see devenv.py write_prometheus_scrape_config).
[prometheus]
# Set by how fine-grained a rate() is wanted rather than by scrape cost -- the venue's
# metrics are a handful of counters and one histogram per gateway. 5s gives a usable rate
# over a one-minute window during a load test.
scrape_interval   = "5s"
scrape_timeout    = "4s"
environment_label = "dev"

# Targets that are not venue components, so they cannot be discovered from the deployed
# configs. A property of the host rather than of the venue, which is why they are listed
# here; omit the section entirely on a host that has no exporter.
#
# node_exporter earns its place specifically for the hot-path core work: it publishes
# per-CPU utilisation, IRQ counts and context switches, so a gateway round-trip percentile
# can be overlaid on what the cores were actually doing at the time. Kept in the same
# database as the venue's metrics precisely so that overlay is one query rather than two
# servers compared by eye. See docs/framework/cpu_pinning_anti_affinity.md.
[[prometheus.extra_job]]
name    = "node"
comment = "machine metrics -- per-core utilisation and IRQ rates, for latency investigation"
targets = ["127.0.0.1:9100"]

# ── Template substitution values ──────────────────────────────────────────────
# deploy.py expands ${placeholder} in component config templates using these
# values.  Placeholder names are the full flattened TOML path of the value
# below: section + "_" + key, e.g. [arbiter_primary] peer_host → ${arbiter_primary_peer_host}.

[shared]
# Metrics for the whole venue. One edit turns the scrape endpoints on or off
# everywhere; each component still has its own listener host and port below.
metrics_enabled     = true
metrics_application = "pubsub"
# Bucket bounds in nanoseconds for the order round-trip histogram, which every order
# gateway registers. Declared once here and expanded into each gateway's file because
# the metric exists to compare the FIX gateway against the binary one: histograms with
# different bounds cannot be compared or aggregated, so a per-gateway value would make
# the comparison meaningless the first time one of them was tuned alone.
#
# The range has to span TWO regimes, which is what earlier, narrower bounds got wrong.
#
#   Service time -- a rate-limited run, where the pipeline keeps up. Round trips of 119,
#   356 and 528 microseconds were recorded at 4, 20 and 40 concurrent sessions. This is the
#   regime the FIX-versus-binary comparison lives in, so the microsecond end needs fine
#   resolution or an improvement disappears into one bucket.
#
#   Queueing -- a saturating throughput run, which is what perf_run.py does by default:
#   it offers load faster than the pipeline drains, deliberately. A 20,000-order run
#   measured a mean of 101ms, and against bounds topping out at 100ms fully 59% of
#   observations landed in the overflow bucket, leaving no usable percentile at all.
#
#   Outage -- an order caught across a failover. The sequencer defers orders while no
#   matching engine is connected and the promoted one replays them, so the round trip is
#   the length of the outage, not a latency at all. A trading-day run put 223,824 orders
#   (1.87%) past the old 5s top bound, and the histogram's _sum -- which counts the
#   overflow even though the buckets do not -- puts their MEAN at 62s or more. Against
#   bounds topping out at 5s the whole population was unmeasurable, and the p99 read as a
#   flat 5000ms clamp: histogram_quantile returns the highest finite bound when the
#   quantile falls in the overflow, so the chart reported the largest number it could
#   express rather than what happened.
#
# Resolution above a minute is deliberately coarse. By then the question is no longer how
# slow but whether an order was caught in an outage, and 50s-250s is one bucket because
# the difference between 90s and 200s changes no decision.
#
# The top bound matters for a second reason: an overflow bucket should be rare enough that
# reaching it is itself the finding. At 5s it held 1.87% of an ordinary run, which makes it
# a bucket rather than an overflow, and nothing about a value landing there was remarkable.
#
# Covering all three costs nine extra series per gateway, which is nothing, and the
# alternative are bucket bounds that are useless in whichever regime is not being run
# that day.
metrics_order_round_trip_buckets = [
    10000, 25000, 50000, 100000,          # 10us 25us 50us 100us   -- service time
    250000, 500000, 1000000, 2500000,     # 250us 500us 1ms 2.5ms
    5000000, 10000000, 25000000,          # 5ms 10ms 25ms
    50000000, 100000000, 250000000,       # 50ms 100ms 250ms       -- queueing
    500000000, 1000000000, 2500000000,    # 500ms 1s 2.5s
    5000000000,                           # 5s                     -- a genuine stall
    10000000000, 25000000000,             # 10s 25s                -- outage, not latency
    50000000000, 250000000000 ]           # 50s 250s               -- caught across a failover
# How long committing one record to the write-ahead log takes, in nanoseconds. Every order
# the venue takes passes through this, on the sequencer's reactor thread, so a slow commit is
# a stalled sequencer rather than a slow disk somewhere off the path.
#
# The range is wide for a reason found by measurement. An ordinary commit is microseconds,
# but on 2026-08-31 the thread was seen in uninterruptible sleep for up to 557 ms at a
# stretch, waiting on I/O with no time on the run queue at all. Bounds chosen for the
# ordinary case would put every one of those excursions in the overflow bucket and report the
# same percentile whatever the truth was -- so the bounds reach to a second, well past
# anything that should ever be seen.
metrics_wal_append_buckets = [
    1000, 2500, 5000, 10000,              # 1us 2.5us 5us 10us     -- a commit to the page cache
    25000, 50000, 100000, 250000,         # 25us 50us 100us 250us
    500000, 1000000, 2500000,             # 500us 1ms 2.5ms
    5000000, 10000000, 25000000,          # 5ms 10ms 25ms          -- something waited
    50000000, 100000000, 200000000,       # 50ms 100ms 200ms       -- 200ms is a reporting threshold
    250000000, 500000000, 1000000000,     # 250ms 500ms 1s          -- 474ms measured on 2026-08-31
    2000000000 ]                          # 2s                      -- worse than anything seen
reactor_cpu_pinning_reserve_cpu0   = true
# The CPU registry file and its lock live under install_dir/run/ and are set
# by deploy.py, which is the single place that knows the install layout.  They
# are deliberately not configurable here: two installations on one machine must
# not share a registry.

[witness]
metrics_listen_host = "127.0.0.1"
metrics_listen_port = 9200
network_listen_host = "127.0.0.1"
network_listen_port = 11100
command_queue_pool_initial_slabs            = 1
command_queue_pool_objects_per_slab         = 16
event_queue_pool_initial_slabs              = 1
event_queue_pool_objects_per_slab           = 16

[arbiter_primary]
metrics_listen_host = "127.0.0.1"
metrics_listen_port = 9201
network_listen_host  = "127.0.0.1"
network_listen_port  = 11200
peer_listen_host     = "127.0.0.1"
peer_listen_port     = 11203
peer_host            = "127.0.0.1"
peer_port            = 11204
witness_host         = "127.0.0.1"
witness_port         = 11100
command_queue_pool_initial_slabs            = 1
command_queue_pool_objects_per_slab         = 64
event_queue_pool_initial_slabs              = 1
event_queue_pool_objects_per_slab           = 64

[arbiter_secondary]
metrics_listen_host = "127.0.0.1"
metrics_listen_port = 9202
network_listen_host  = "127.0.0.1"
network_listen_port  = 11201
peer_listen_host     = "127.0.0.1"
peer_listen_port     = 11204
peer_host            = "127.0.0.1"
peer_port            = 11203
witness_host         = "127.0.0.1"
witness_port         = 11100
command_queue_pool_initial_slabs            = 1
command_queue_pool_objects_per_slab         = 64
event_queue_pool_initial_slabs              = 1
event_queue_pool_objects_per_slab           = 64

[auth_service_a]
metrics_listen_host = "127.0.0.1"
metrics_listen_port = 9203
network_listen_host  = "127.0.0.1"
network_listen_port  = 11070
admin_listen_port    = 11072
command_queue_pool_initial_slabs            = 1
command_queue_pool_objects_per_slab         = 64
event_queue_pool_initial_slabs              = 1
event_queue_pool_objects_per_slab           = 64

[auth_service_b]
metrics_listen_host = "127.0.0.1"
metrics_listen_port = 9204
network_listen_host  = "127.0.0.1"
network_listen_port  = 11071
admin_listen_port    = 11073
command_queue_pool_initial_slabs            = 1
command_queue_pool_objects_per_slab         = 64
event_queue_pool_initial_slabs              = 1
event_queue_pool_objects_per_slab           = 64

[matching_engine]
# Where the leadership epoch outlives the process, so a restart cannot reuse a
# generation the venue has already spent. Kept outside the versioned tree in
# the deployed environments for the same reason the WAL is.
epoch_state_file    = "var/matching_engine_epoch.state"
# The open orders, so an order placed before a restart is still open after one.
# Alongside the epoch file and outside the versioned tree for the same reason.
order_book_region_path     = "var/matching_engine_open_orders.region"
# The most orders that may be open at once; the region cannot grow past it.
order_book_region_capacity = 2000000
# How long the venue may be unable to match before open orders are cancelled and
# trading halts. A trading decision: how long a resting order stays meaningful here.
order_book_absence_limit_seconds = 300
metrics_listen_host = "127.0.0.1"
metrics_listen_port = 9205
network_listen_host           = "127.0.0.1"
network_listen_port           = 11020
sequencer_er_host             = "127.0.0.1"
sequencer_er_port             = 11021
sequencer_er_secondary_host   = "127.0.0.1"
sequencer_er_secondary_port   = 11022
# Book replication is symmetric: each instance listens, and each dials the other. Both
# connections stand at all times and a role change only switches which one carries traffic.
# Wiring it one way round -- primary dials, secondary listens -- meant that after a failover
# there was no channel at all in the direction replication then needed to flow, and the
# surviving instance never noticed the leader die. See docs/bug_list.md, BUG-0034.
book_replication_listen_host  = "127.0.0.1"
book_replication_listen_port  = 11025
book_replication_host         = "127.0.0.1"
book_replication_port         = 11026
# HA arbiter-mediated promotion (Slice C+D).
instance_id                   = 1
arbiter_primary_host          = "127.0.0.1"
arbiter_primary_port          = 11200
arbiter_secondary_host        = "127.0.0.1"
arbiter_secondary_port        = 11201
command_queue_pool_initial_slabs            = 1
command_queue_pool_objects_per_slab         = 500000
event_queue_pool_initial_slabs              = 1
event_queue_pool_objects_per_slab           = 10240

[matching_engine_secondary]
# Where the leadership epoch outlives the process, so a restart cannot reuse a
# generation the venue has already spent. Kept outside the versioned tree in
# the deployed environments for the same reason the WAL is.
epoch_state_file    = "var/matching_engine_secondary_epoch.state"
