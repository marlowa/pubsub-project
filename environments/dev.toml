sequencer_primary_port   = 11001
sequencer_secondary_host = "127.0.0.1"
sequencer_secondary_port = 11002
# This is the instance the load harness drives, so it reserves a day's open interest up
# front rather than chaining a slab at a time on the hot path. One slot costs 192 bytes:
# Slot<OpenOrderEntry> is 184 (an atomic flag, a canary and the 168-byte entry) and the
# free list holds a pointer to each. 21 x 2^20 slots is 22.0M open orders for 3.94 GB.
#
# The ceiling here is the 32 GB of a typical developer machine, not what a production
# environment would need: the two matching engines want roughly 21 GB between them at the
# book size this profile reaches, so a larger reservation would starve the thing the run
# exists to measure. Sized for the real target -- tens of millions of orders a day, mostly
# resting -- this pool needs about 7.7 GB, and the engine pair an order of magnitude more.
open_order_pool_objects_per_pool = 1048576
open_order_pool_initial_pools    = 21
