db.url=${admin_service_db_url}
db.username=pubsub_app
db.password=pubsub_dev
db.table-prefix=pubsub_

# Set to false when the auth service is not running (e.g. during DB-only development)
auth-service.enabled=true
# The auth service runs active/active; credential updates are fanned out to both
# instances. The secondary is optional -- leave secondary-host blank to notify
# only the primary.
auth-service.host=${admin_service_auth_service_host}
auth-service.admin-port=${admin_service_auth_service_admin_port}
auth-service.secondary-host=${admin_service_auth_service_secondary_host}
auth-service.secondary-admin-port=${admin_service_auth_service_secondary_admin_port}

server.port=${admin_service_server_port}

# Path to the admin UI user store file (created on first run).
# Relative paths are resolved against the working directory.
admin.users-file=admin_users.toml

# Branding — all optional.
# brand.name:     product name shown in page titles and the nav header.
# brand.logo-url: URL of a logo image shown in the nav header and login page.
#                 May be an absolute intranet URL or a relative path under /static/.
# brand.css-file: filesystem path to a CSS file whose content is inlined into every page.
#                 Use to override the custom properties declared at the top of
#                 static/desktop.css, e.g.:
#                   :root { --admin-accent-colour: #003087; --admin-chrome-background: #dfe4ec; }
brand.name=PubSub Admin
brand.logo-url=
brand.css-file=
