<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FIX Test Client — Session</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="content">
    <h1>Session</h1>
    <hr class="section-rule">

    <!-- Last session summary (shown after logout) -->
    <div id="last-session-summary" style="display:none; margin-bottom:20px;">
        <div style="margin-bottom:4px; font-weight:bold;">Last session</div>
        <hr class="section-rule">
        <table class="info-table">
            <tr><td>Logged in as</td><td id="ls-sender"></td></tr>
            <tr><td>Started</td><td id="ls-start"></td></tr>
            <tr><td>Ended</td><td id="ls-end"></td></tr>
            <tr><td>Duration</td><td id="ls-duration"></td></tr>
        </table>
    </div>

    <!-- Pre-logon form -->
    <div id="logon-form">
        <!-- One row per configured endpoint, built by renderGatewayList() from
             /api/session/ports. Not hardcoded here: the venue runs two instances of each
             protocol and which of them this client may reach is a deployment fact, so the
             page shows what it has been given rather than what someone typed into a form
             once. -->
        <div class="form-row" style="align-items:flex-start;">
            <label>Gateway</label>
            <div id="gateway-list"></div>
        </div>
        <div class="form-row">
            <label></label>
            <span id="gateway-note" style="color:#555; font-size:0.9em;"></span>
        </div>
        <div class="form-row">
            <label>SenderCompID</label>
            <input type="text" id="sender-comp-id" value="APM001" oninput="updateLogonButton()">
        </div>
        <div class="form-row">
            <label>TargetCompID</label>
            <input type="text" id="target-comp-id" value="GATEWAY">
        </div>
        <div class="form-row">
            <label>Password</label>
            <input type="password" id="password" oninput="updateLogonButton()">
        </div>
        <div class="form-row fix-only">
            <label>Use TLS</label>
            <input type="checkbox" id="use-tls" checked onchange="updatePortDisplay()">
            <span id="port-display" style="margin-left:10px; color:#555; font-size:0.9em;"></span>
        </div>
        <div class="form-row fix-only">
            <label>Starting seq num</label>
            <input type="checkbox" id="override-seq-check" onchange="toggleSeqInput()">
            Override
            <input type="number" id="override-seq-num" value="1" disabled style="width:80px;">
        </div>
        <div class="form-row" style="margin-top:10px;">
            <label></label>
            <button id="logon-btn" onclick="doLogon()" disabled>Log On</button>
            <button id="cancel-btn" onclick="doCancel()" style="display:none; margin-left:8px;">Cancel</button>
            <!-- Says why Log On is greyed out. Beside the button rather than beside the
                 field it refers to, because the button is where you look when it will not
                 respond. -->
            <span id="logon-hint" style="margin-left:10px; color:#666; font-size:0.85rem;"></span>
        </div>
        <div id="logon-error" style="display:none; color:#c00; margin-top:8px;"></div>
    </div>

    <!-- Post-logon detail -->
    <div id="logon-detail" style="display:none;">
        <table class="info-table">
            <tr><td>Logged in as</td><td id="d-sender"></td></tr>
            <tr><td>Gateway</td><td id="d-gateway"></td></tr>
            <tr><td>Logged in at</td><td id="d-logon-time"></td></tr>
            <tr><td>Duration</td><td id="d-duration"></td></tr>
            <tr><td>Starting seq</td><td id="d-start-seq"></td></tr>
            <tr><td>Outbound seq</td><td id="d-out-seq"></td></tr>
            <tr><td>Inbound seq</td><td id="d-in-seq"></td></tr>
        </table>
        <button onclick="doLogout()">Log Out</button>
    </div>
</div>

<script src="/app.js"></script>
<script>
'use strict';

let durationTimer = null;
let logonEpochMs = null;

function toggleSeqInput() {
    document.getElementById('override-seq-num').disabled =
        !document.getElementById('override-seq-check').checked;
}

/** @return the key of the selected endpoint, e.g. "fix-b", or '' before the list loads. */
function selectedGateway() {
    const chosen = document.querySelector('input[name="gateway"]:checked');
    return chosen ? chosen.value : '';
}

/** @return the selected endpoint object, or null before the list has loaded. */
function selectedEndpoint() {
    const key = selectedGateway();
    return endpoints.find(e => e.key === key) || null;
}

// Builds one row per configured endpoint, each naming the gateway AND its address.
//
// Showing the address matters: protocol and instance are two axes that between them pick a
// port, and a form that asks you to combine them without showing the result is how instance
// b came to be unreachable without anyone noticing.
function renderGatewayList() {
    const list = document.getElementById('gateway-list');
    if (!list) {
        return;
    }
    list.innerHTML = '';
    endpoints.forEach((endpoint, index) => {
        const row = document.createElement('label');
        row.style.cssText = 'display:block; font-weight:normal; margin-bottom:2px;';

        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'gateway';
        radio.value = endpoint.key;
        radio.checked = index === 0;
        radio.onchange = onGatewayChange;
        row.appendChild(radio);

        const name = document.createElement('span');
        name.textContent = ' ' + endpoint.label + ' ';
        row.appendChild(name);

        const address = document.createElement('span');
        address.style.cssText = 'color:#666; font-size:0.9em;';
        address.textContent = endpoint.host + ':' + endpoint.port;
        row.appendChild(address);

        list.appendChild(row);
    });
}

// The binary gateway has no password, no TLS listener and no session-layer sequence
// numbers, so its fields are hidden rather than shown-but-ignored: a disabled password box
// still suggests the protocol has one.
function onGatewayChange() {
    const endpoint = selectedEndpoint();
    const binary = endpoint ? endpoint.protocol === 'binary' : false;
    document.querySelectorAll('.fix-only').forEach(row => {
        row.style.display = binary ? 'none' : '';
    });

    let note = '';
    if (binary) {
        note = 'Binary gateway: SCRAM authenticated, no TLS listener or sequence numbers';
    } else if (endpoint && endpoint.proprietary) {
        note = 'Proprietary dialect: nanosecond timestamps, plaintext only';
    }
    document.getElementById('gateway-note').textContent = note;

    // Each gateway answers to its own name, so carrying one default across to the other
    // would have the gateway refuse a logon that looked perfectly reasonable on screen.
    const target = document.getElementById('target-comp-id');
    if (target) {
        target.value = binary ? 'BINARY-GATEWAY' : 'GATEWAY';
    }
    applyTlsAvailability();
    updateLogonButton();
    updatePortDisplay();
}

function updateLogonButton() {
    // Both gateways authenticate, so both need a password; the binary one also needs the
    // comp id, since it has no other way to know who is connecting.
    const button = document.getElementById('logon-btn');
    const password = document.getElementById('password').value;
    const missing = [];
    if (!password) {
        missing.push('a password');
    }
    const endpoint = selectedEndpoint();
    if (endpoint && endpoint.protocol === 'binary' && !document.getElementById('sender-comp-id').value.trim()) {
        missing.push('a SenderCompID');
    }
    button.disabled = missing.length > 0;

    // Say WHY it is disabled, rather than leaving a dead-looking button.
    //
    // This is not cosmetic. When the gateway dies, the session drops and the page returns
    // you to an empty logon form -- so the button is greyed for a perfectly ordinary reason
    // that looks, at that moment, exactly like the client having seized up along with the
    // gateway. The requirement has to advertise itself.
    const hint = document.getElementById('logon-hint');
    if (hint) {
        hint.textContent = missing.length ? 'Enter ' + missing.join(' and ') + ' to log on.' : '';
    }
}

async function doCancel() {
    await apiPost('/api/session/logout', {});
}

async function doLogon() {
    const btn = document.getElementById('logon-btn');
    btn.textContent = 'Connecting…';
    btn.disabled = true;

    const params = {
        gateway:          selectedGateway(),
        senderCompId:     document.getElementById('sender-comp-id').value,
        targetCompId:     document.getElementById('target-comp-id').value,
        password:         document.getElementById('password').value,
        useTls:           document.getElementById('use-tls').checked,
        overrideSeq:      document.getElementById('override-seq-check').checked,
        overrideSeqNum:   document.getElementById('override-seq-num').value,
    };
    await apiPost('/api/session/logon', params);
    // Button is re-enabled by renderNotLoggedOn if the logon fails,
    // or hidden by renderLoggedOn if it succeeds.
}

async function doLogout() {
    const btn = document.querySelector('#logon-detail button');
    btn.textContent = 'Logging out…';
    btn.disabled = true;
    await apiPost('/api/session/logout', {});
    // renderNotLoggedOn will fire on the next status poll and show the logon form.
}

function startDurationTick(logonTimeStr) {
    const parts = logonTimeStr.split(/[\- :]/);
    logonEpochMs = Date.UTC(parts[0], parts[1]-1, parts[2], parts[3], parts[4], parts[5]);
    clearInterval(durationTimer);
    durationTimer = setInterval(() => {
        const elapsed = Math.floor((Date.now() - logonEpochMs) / 1000);
        const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
        const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        const el = document.getElementById('d-duration');
        if (el) {
            el.textContent = h + ':' + m + ':' + s;
        }
    }, 1000);
}

function formatLogonTime(utcStr) {
    if (!utcStr) return '';
    // Server sends "yyyy-MM-dd HH:mm:ss" in UTC. Appending Z makes it
    // unambiguously UTC for the Date constructor.
    const d = new Date(utcStr.replace(' ', 'T') + 'Z');
    if (isNaN(d)) return utcStr;
    const local = d.toLocaleString(undefined, {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
    });
    return utcStr + ' UTC  (' + local + ' local)';
}

function renderLoggedOn(status) {
    document.getElementById('logon-form').style.display = 'none';
    document.getElementById('logon-detail').style.display = '';
    document.getElementById('last-session-summary').style.display = 'none';
    document.getElementById('logon-error').style.display = 'none';

    const logoutBtn = document.querySelector('#logon-detail button');
    if (logoutBtn) {
        logoutBtn.textContent = 'Log Out';
        logoutBtn.disabled = false;
    }

    document.getElementById('d-sender').textContent = status.senderCompId;
    document.getElementById('d-gateway').textContent =
        status.targetCompId + '  @  ' + status.host + ':' + status.port;
    document.getElementById('d-logon-time').textContent = formatLogonTime(status.logonTime);
    document.getElementById('d-start-seq').textContent = status.startingSeqNum;
    document.getElementById('d-out-seq').textContent = status.nextOutgoingSeqNum;
    document.getElementById('d-in-seq').textContent = status.nextIncomingSeqNum;

    if (logonEpochMs === null && status.logonTime) {
        startDurationTick(status.logonTime);
    }
}

function renderNotLoggedOn(status) {
    document.getElementById('logon-form').style.display = '';
    document.getElementById('logon-detail').style.display = 'none';
    clearInterval(durationTimer);
    logonEpochMs = null;

    const btn       = document.getElementById('logon-btn');
    const cancelBtn = document.getElementById('cancel-btn');

    if (status.loggingOn) {
        // Mid-attempt: keep the logon button disabled, show Cancel.
        if (btn) {
            btn.textContent = 'Connecting…';
            btn.disabled = true;
        }
        if (cancelBtn) cancelBtn.style.display = '';
        const errEl = document.getElementById('logon-error');
        if (errEl) errEl.style.display = 'none';
        return;
    }

    // Not connecting — re-enable Log On, hide Cancel.
    if (cancelBtn) cancelBtn.style.display = 'none';
    if (btn) {
        btn.textContent = 'Log On';
        // Delegate rather than test the password field directly: what makes a logon
        // possible depends on the gateway, and this runs on every status poll, so
        // duplicating the rule here silently overrides it a second later.
        updateLogonButton();
    }

    const errEl = document.getElementById('logon-error');
    if (errEl) {
        if (status.lastError) {
            errEl.textContent = 'Logon failed: ' + status.lastError;
            errEl.style.display = '';
        } else {
            errEl.style.display = 'none';
        }
    }

    const suggested = status.suggestedSeqNum;
    if (suggested > 0) {
        const overrideCheck = document.getElementById('override-seq-check');
        const overrideNum   = document.getElementById('override-seq-num');
        if (overrideCheck && overrideNum) {
            overrideCheck.checked  = true;
            overrideNum.value      = suggested;
            overrideNum.disabled   = false;
        }
    }
}

async function loadLastSession() {
    const data = await apiGet('/api/session/last');
    if (data.present) {
        document.getElementById('last-session-summary').style.display = '';
        document.getElementById('ls-sender').textContent = data.senderCompId;
        document.getElementById('ls-start').textContent = data.startTime;
        document.getElementById('ls-end').textContent = data.endTime;
        document.getElementById('ls-duration').textContent = data.duration;
    }
}

let prevLoggedOn = null;
let endpoints = [];       // every gateway this client may log on to, from the server
let tlsConfigured = false;

// Shows the address the current choices resolve to, so the port is never something you
// have to work out from a protocol, an instance and a checkbox.
function updatePortDisplay() {
    const endpoint = selectedEndpoint();
    const el = document.getElementById('port-display');
    if (!el) {
        return;
    }
    if (!endpoint) {
        el.textContent = '';
        return;
    }
    const useTls = document.getElementById('use-tls').checked && endpoint.supportsTls;
    const port = useTls ? endpoint.tlsPort : endpoint.port;
    el.textContent = '→ ' + endpoint.host + ':' + port + (useTls ? ' (TLS)' : '');
}

// TLS is offered only where there is a listener for it.
//
// This used to be a venue-wide flag plus a special case for the proprietary checkbox. Now
// each endpoint says for itself: the binary gateways have no TLS listener and the
// proprietary dialect is plaintext by definition, so for those the control is disabled and
// says why rather than offering a choice that could only fail.
function applyTlsAvailability() {
    const tlsCheckbox = document.getElementById('use-tls');
    if (!tlsCheckbox) {
        return;
    }
    const endpoint = selectedEndpoint();
    if (endpoint && !endpoint.supportsTls) {
        tlsCheckbox.checked  = false;
        tlsCheckbox.disabled = true;
        tlsCheckbox.title    = endpoint.label + ' has no TLS listener';
    } else if (!tlsConfigured) {
        tlsCheckbox.checked  = false;
        tlsCheckbox.disabled = true;
        tlsCheckbox.title    = 'TLS is not configured on the gateway';
    } else {
        tlsCheckbox.checked  = true;
        tlsCheckbox.disabled = false;
        tlsCheckbox.title    = '';
    }
}

async function loadPorts() {
    const data = await apiGet('/api/session/ports');
    endpoints = data.gateways || [];
    tlsConfigured = !!data.tlsEnabled;
    renderGatewayList();
    // Applies the first endpoint's rules -- TLS availability, which fields are shown, the
    // TargetCompID default -- so the form is consistent before anyone touches it.
    onGatewayChange();
}

function pageInit() {
    // loadPorts builds the endpoint list and then applies the first one's rules. Nothing
    // here can call onGatewayChange first: until the list arrives there is no endpoint
    // selected, and the form would be laid out for a gateway that may not be the default.
    loadPorts();
    loadLastSession();

    const originalPoll = window._sessionStatusCallback;
    window._sessionStatusCallback = function(status) {
        if (status.loggedOn) {
            renderLoggedOn(status);
        } else {
            if (prevLoggedOn === true) {
                loadLastSession();
            }
            renderNotLoggedOn(status);
        }
        prevLoggedOn = status.loggedOn;
    };

    // Override the status strip updater to also drive the page.
    const originalUpdate = window.updateStatusStrip || function() {};
    window.updateStatusStrip = function(status) {
        originalUpdate(status);
        window._sessionStatusCallback(status);
    };
}
</script>
</body>
</html>
